name: CI

on:
  push:
    branches: [ main, release-please--branches--main ]
  pull_request:
    branches: [ main, release-please--branches--main ]

jobs:
  static-checks:
    name: Static & Release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Static & Policy Checks
        run: mise run test:checks

  validate-patches:
    name: Validate Upstream Patch Rebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Apply All Patches
        run: mise run patch

  kueue-unit-tests:
    name: Kueue Unit Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched Kueue Unit Tests
        run: mise run test:kueue

  kueue-integration-tests:
    name: Kueue Integration Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched Kueue Integration Tests
        run: mise run test:kueue-integration

  kuberay-unit-tests:
    name: KubeRay Unit Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched KubeRay Unit Tests
        run: mise run test:kuberay

  interlink-unit-tests:
    name: interLink Unit Tests
    needs: [validate-patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Run Patched Virtual Kubelet Unit Tests
        run: mise run test:interlink

  e2e-integration-tests:
    name: Canonical E2E Integration Test
    needs: [validate-patches, kueue-unit-tests, kuberay-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Build Patched Images
        run: mise run build
      - name: Spin up Cluster and Deploy Patched Controllers
        run: mise run cluster:up
      - name: Watch Workloads and Events
        # Chainsaw deletes each test namespace on exit, so stream changes while they exist.
        run: |
          mkdir -p evidence
          nohup kubectl get workloads -A -o yaml --watch > evidence/workloads-watch.yaml 2>&1 &
          nohup kubectl get events -A -o yaml --watch > evidence/events-watch.yaml 2>&1 &
      - name: Run Canonical E2E Integration Test
        run: mise run test:e2e
      - name: Collect Failure Evidence
        if: failure()
        run: |
          mkdir -p evidence
          pkill -f 'kubectl get' || true
          kubectl logs -n kueue-system -l app.kubernetes.io/name=kueue --tail=-1 > evidence/kueue-controller.log 2>&1 || true
          kubectl logs -n kueue-system -l app.kubernetes.io/name=kueue --tail=-1 --previous > evidence/kueue-controller-previous.log 2>&1 || true
          kubectl logs -n default -l app.kubernetes.io/name=kuberay-operator --tail=-1 > evidence/kuberay-operator.log 2>&1 || true
          kubectl get workloads -A -o yaml > evidence/workloads.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp -o yaml > evidence/events.yaml 2>&1 || true
      - name: Upload Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: evidence/
          retention-days: 14
