name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      ray_release_created: ${{ steps.release.outputs['patches/ray--release_created'] }}
      ray_tag_name: ${{ steps.release.outputs['patches/ray--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install Ko
        uses: ko-build/setup-ko@v0.10

      - name: Install Mise
        uses: jdx/mise-action@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Patched Images to GHCR
        run: "mise run publish:kueue ::: publish:kuberay ::: publish:interlink"

  ray-wheels:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.ray_release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/ray-wheels.yaml
    with:
      release-tag: ${{ needs.release-please.outputs.ray_tag_name }}

  # The images install the wheel of the Ray release, so a Ray release builds and publishes it first.
  publish-ray-images:
    needs: [release-please, ray-wheels]
    if: ${{ always() && needs.release-please.result == 'success' && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["success", "skipped"]'), needs.ray-wheels.result) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ray-images.yaml
    with:
      release-tag: ${{ needs.release-please.outputs.ray_tag_name }}
