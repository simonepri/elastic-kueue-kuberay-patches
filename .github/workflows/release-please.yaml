name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      kueue_release_created: ${{ steps.release.outputs['patches/kueue--release_created'] }}
      kuberay_release_created: ${{ steps.release.outputs['patches/kuberay--release_created'] }}
      interlink_release_created: ${{ steps.release.outputs['patches/interlink--release_created'] }}
      ray_release_created: ${{ steps.release.outputs['patches/ray--release_created'] }}
      ray_tag_name: ${{ steps.release.outputs['patches/ray--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.kueue_release_created == 'true' || needs.release-please.outputs.kuberay_release_created == 'true' || needs.release-please.outputs.interlink_release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Patched Kueue Image to GHCR
        if: ${{ needs.release-please.outputs.kueue_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: "mise run publish:kueue"

      - name: Build and Publish Patched KubeRay Image to GHCR
        if: ${{ needs.release-please.outputs.kuberay_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: "mise run publish:kuberay"

      - name: Build and Publish Patched interLink Image to GHCR
        if: ${{ needs.release-please.outputs.interlink_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: "mise run publish:interlink"

  ray-wheels-build:
    name: Build Ray Wheel (${{ matrix.arch }})
    needs: [release-please]
    if: ${{ needs.release-please.outputs.ray_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      RAY_WHEEL_ARCH: ${{ matrix.arch }}
      CACHE_DIR: .ray-wheel/cache-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: Read Ray Upstream Version
        id: ray
        run: echo "upstream=$(mise env --json | jq -r .RAY_UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.CACHE_DIR }}/disk
            ${{ env.CACHE_DIR }}/repos
          key: ray-wheel-${{ matrix.arch }}-${{ steps.ray.outputs.upstream }}-${{ hashFiles('patches/ray/*.patch') }}
          restore-keys: |
            ray-wheel-${{ matrix.arch }}-${{ steps.ray.outputs.upstream }}-

      - name: Build Wheel
        run: mise run build:ray-wheel

      - name: Save Bazel Cache
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.CACHE_DIR }}/disk
            ${{ env.CACHE_DIR }}/repos
          key: ray-wheel-${{ matrix.arch }}-${{ steps.ray.outputs.upstream }}-${{ hashFiles('patches/ray/*.patch') }}

      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: ray-wheel-${{ matrix.arch }}
          path: |
            dist/ray/*.whl
            dist/ray/*.whl.sha256
          if-no-files-found: error

  ray-wheels-publish:
    name: Attach Wheels And Publish The Release
    needs: [release-please, ray-wheels-build]
    if: ${{ needs.release-please.outputs.ray_release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.ray_tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Require A Draft Release
        run: |
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "::error::$TAG is already published, so it is immutable and cannot take assets"
            exit 1
          fi

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          pattern: ray-wheel-*
          merge-multiple: true
          path: dist/ray

      - name: Upload To The Release
        run: gh release upload "$TAG" dist/ray/*.whl dist/ray/*.whl.sha256 --clobber --repo "$GITHUB_REPOSITORY"

      - name: Check The Uploaded Asset Names
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for file in dist/ray/*.whl dist/ray/*.whl.sha256; do
            name="$(basename "$file")"
            echo "$assets" | grep -Fxq -- "$name" || { echo "::error::asset $name is missing or was renamed"; exit 1; }
          done

      - name: Publish The Release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  ray-variants:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Read Ray Image Variants
        id: variants
        run: echo "matrix=$(jq -c . build/ray/image-variants.json)" >> "$GITHUB_OUTPUT"

  publish-ray-images:
    name: publish-ray-images (py313${{ matrix.variant }})
    needs: [release-please, ray-variants, ray-wheels-publish]
    if: ${{ always() && needs.release-please.result == 'success' && (needs.release-please.outputs.ray_release_created == 'true' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["success", "skipped"]'), needs.ray-wheels-publish.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ray-variants.outputs.matrix) }}
    env:
      RAY_VARIANT: ${{ matrix.variant }}
      RAY_PLATFORMS: ${{ matrix.platforms }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the Versions of the Release
        if: ${{ needs.release-please.outputs.ray_tag_name != '' }}
        env:
          TAG: ${{ needs.release-please.outputs.ray_tag_name }}
        run: |
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          for var in RAY_UPSTREAM RAY_PATCH_VERSION; do
            line="$(git show "$TAG:mise.toml" | grep "^$var = ")"
            sed -i "s|^$var = .*|$line|" mise.toml
          done
          grep -E "^RAY_(UPSTREAM|PATCH_VERSION) =" mise.toml

      - name: Free Disk Space for the CUDA Base Image
        if: ${{ matrix.variant != '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish the Patched Ray Image to GHCR
        run: mise run publish:ray
