[tools]
go = "1.27.3"
kind = "0.33.0"
kubectl = "1.37.2"
"aqua:kyverno/chainsaw" = "0.2.15"
helm = "4.3.1"
ko = "0.19.1"
colima = "0.10.3"
docker-cli = "29.9.2"

[env]
CLUSTER_NAME = "elastic-scale-lab"

# Upstream versions
# renovate: datasource=github-releases depName=kubernetes-sigs/kueue
KUEUE_UPSTREAM = "v0.20.4"
# renovate: datasource=github-releases depName=ray-project/kuberay
KUBERAY_UPSTREAM = "v1.7.1"
# renovate: datasource=github-releases depName=kubernetes-sigs/karpenter
KARPENTER_UPSTREAM = "v1.15.1"
# renovate: datasource=github-releases depName=interlink-hq/interLink
INTERLINK_UPSTREAM = "0.6.2"
# renovate: datasource=docker depName=rayproject/ray
RAY_UPSTREAM = "2.59.0"
RAY_PYTHON = "py313"
# Upstream Ray image variant (the tag suffix after the Python version, such as "-gpu") and its platforms;
# CI builds every variant in patches/ray/variants.json by setting both.
RAY_VARIANT = "{{ get_env(name='RAY_VARIANT', default='') }}"
RAY_PLATFORMS = "{{ get_env(name='RAY_PLATFORMS', default='linux/amd64,linux/arm64') }}"

# Internal patchset versions (tracks release-please manifests)
KUEUE_PATCH_VERSION = "0.6.0"
KUBERAY_PATCH_VERSION = "0.3.6"
INTERLINK_PATCH_VERSION = "0.5.0" # x-release-please-version
RAY_PATCH_VERSION = "0.2.0"

# Derived full image tags: <upstream>-p<patch_version>
KUEUE_IMAGE_TAG = "{{env.KUEUE_UPSTREAM}}-p{{env.KUEUE_PATCH_VERSION}}"
KUBERAY_IMAGE_TAG = "{{env.KUBERAY_UPSTREAM}}-p{{env.KUBERAY_PATCH_VERSION}}"
INTERLINK_IMAGE_TAG = "{{env.INTERLINK_UPSTREAM}}-p{{env.INTERLINK_PATCH_VERSION}}"
RAY_BASE_IMAGE = "rayproject/ray:{{env.RAY_UPSTREAM}}-{{env.RAY_PYTHON}}{{env.RAY_VARIANT}}"
RAY_IMAGE_TAG = "{{env.RAY_UPSTREAM}}-{{env.RAY_PYTHON}}{{env.RAY_VARIANT}}-p{{env.RAY_PATCH_VERSION}}"

[tasks."clone:kueue"]
description = "Clone upstream Kueue at target version"
run = """
if [ ! -d third_party/kueue/.git ]; then
  mkdir -p third_party
  echo "Cloning Kueue $KUEUE_UPSTREAM..."
  git clone --depth 1 --branch "$KUEUE_UPSTREAM" https://github.com/kubernetes-sigs/kueue.git third_party/kueue
fi
"""

[tasks."clone:kuberay"]
description = "Clone upstream KubeRay at target version"
run = """
if [ ! -d third_party/kuberay/.git ]; then
  mkdir -p third_party
  echo "Cloning KubeRay $KUBERAY_UPSTREAM..."
  git clone --depth 1 --branch "$KUBERAY_UPSTREAM" https://github.com/ray-project/kuberay.git third_party/kuberay
fi
"""

[tasks."clone:interlink"]
description = "Clone upstream interLink at target version"
run = """
if [ ! -d third_party/interlink/.git ]; then
  mkdir -p third_party
  echo "Cloning interLink $INTERLINK_UPSTREAM..."
  git clone --depth 1 --branch "$INTERLINK_UPSTREAM" https://github.com/interlink-hq/interLink.git third_party/interlink
fi
"""

[tasks."clone:ray"]
description = "Sparse-clone the upstream Ray files that patches/ray touches"
run = """
if [ ! -d third_party/ray/.git ]; then
  mkdir -p third_party/ray
  echo "Cloning Ray $RAY_UPSTREAM files touched by patches/ray..."
  git -C third_party/ray init -q
  git -C third_party/ray remote add origin https://github.com/ray-project/ray.git
  git -C third_party/ray sparse-checkout set --no-cone $(sed -n 's|^+++ b/||p' patches/ray/*.patch | sort -u)
  git -C third_party/ray fetch -q --depth 1 --filter=blob:none origin tag "ray-$RAY_UPSTREAM"
  git -C third_party/ray checkout -q FETCH_HEAD
fi
"""

[tasks."patch:kueue"]
description = "Apply patches to third_party/kueue"
depends = ["clone:kueue"]
run = """
set -e
cd third_party/kueue
# The stamp records the patch set applied to the clone, so a rerun skips it and a stale clone fails.
stamp=.git/applied-patches
want=$(cat ../../patches/kueue/*.patch | git hash-object --stdin)
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then
  echo "Patches already applied to third_party/kueue"
  exit 0
fi
if [ -n "$(git status --porcelain)" ]; then
  echo "third_party/kueue has changes other than the current patches; delete it to apply them again" >&2
  exit 1
fi
for p in ../../patches/kueue/*.patch; do
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p"
done
echo "$want" > "$stamp"
"""

[tasks."patch:kuberay"]
description = "Apply patches to third_party/kuberay"
depends = ["clone:kuberay"]
run = """
set -e
cd third_party/kuberay
# The stamp records the patch set applied to the clone, so a rerun skips it and a stale clone fails.
stamp=.git/applied-patches
want=$(cat ../../patches/kuberay/*.patch | git hash-object --stdin)
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then
  echo "Patches already applied to third_party/kuberay"
  exit 0
fi
if [ -n "$(git status --porcelain)" ]; then
  echo "third_party/kuberay has changes other than the current patches; delete it to apply them again" >&2
  exit 1
fi
for p in ../../patches/kuberay/*.patch; do
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p"
done
echo "$want" > "$stamp"
"""

[tasks."patch:interlink"]
description = "Apply patches to third_party/interlink"
depends = ["clone:interlink"]
run = """
set -e
cd third_party/interlink
# The stamp records the patch set applied to the clone, so a rerun skips it and a stale clone fails.
stamp=.git/applied-patches
want=$(cat ../../patches/interlink/*.patch | git hash-object --stdin)
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then
  echo "Patches already applied to third_party/interlink"
  exit 0
fi
if [ -n "$(git status --porcelain)" ]; then
  echo "third_party/interlink has changes other than the current patches; delete it to apply them again" >&2
  exit 1
fi
for p in ../../patches/interlink/*.patch; do
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p"
done
echo "$want" > "$stamp"
"""

[tasks."patch:ray"]
description = "Apply patches to third_party/ray"
depends = ["clone:ray"]
run = """
set -e
cd third_party/ray
# The stamp records the patch set applied to the clone, so a rerun skips it and a stale clone fails.
stamp=.git/applied-patches
want=$(cat ../../patches/ray/*.patch | git hash-object --stdin)
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then
  echo "Patches already applied to third_party/ray"
  exit 0
fi
if [ -n "$(git status --porcelain)" ]; then
  echo "third_party/ray has changes other than the current patches; delete it to apply them again" >&2
  exit 1
fi
for p in ../../patches/ray/*.patch; do
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p"
done
echo "$want" > "$stamp"
"""

[tasks.patch]
description = "Apply all patches to third_party dependencies"
depends = ["patch:kueue", "patch:kuberay", "patch:interlink", "patch:ray"]

[tasks."build:kueue"]
description = "Build patched Kueue image"
depends = ["patch:kueue"]
run = """
docker build -f docker/kueue.Dockerfile -t kind.local/kueue:$KUEUE_IMAGE_TAG -t kind.local/kueue:latest third_party/kueue
echo "kind.local/kueue:$KUEUE_IMAGE_TAG" > .kueue-image.txt
KUEUE_IMG=$(cat .kueue-image.txt)
echo "Built Kueue image: $KUEUE_IMG"
"""

[tasks."build:kuberay"]
description = "Build patched KubeRay image"
depends = ["patch:kuberay"]
run = """
docker build -f docker/kuberay.Dockerfile -t kind.local/kuberay-operator:$KUBERAY_IMAGE_TAG -t kind.local/kuberay-operator:latest third_party/kuberay/ray-operator
echo "kind.local/kuberay-operator:$KUBERAY_IMAGE_TAG" > .kuberay-image.txt
KUBERAY_IMG=$(cat .kuberay-image.txt)
echo "Built KubeRay image: $KUBERAY_IMG"
"""

[tasks."build:interlink"]
description = "Build patched interLink virtual kubelet image"
depends = ["patch:interlink"]
run = """
docker build -f docker/interlink.Dockerfile --build-arg VERSION=$INTERLINK_IMAGE_TAG -t kind.local/interlink-virtual-kubelet:$INTERLINK_IMAGE_TAG -t kind.local/interlink-virtual-kubelet:latest third_party/interlink
echo "kind.local/interlink-virtual-kubelet:$INTERLINK_IMAGE_TAG" > .interlink-image.txt
INTERLINK_IMG=$(cat .interlink-image.txt)
echo "Built interLink virtual kubelet image: $INTERLINK_IMG"
"""

[tasks."build:ray"]
description = "Build the patched Ray image for RAY_VARIANT"
depends = ["patch:ray"]
run = """
docker build -f docker/ray.Dockerfile --build-arg BASE_IMAGE=$RAY_BASE_IMAGE -t kind.local/ray:$RAY_IMAGE_TAG -t kind.local/ray:latest third_party/ray
echo "kind.local/ray:$RAY_IMAGE_TAG" > .ray-image.txt
RAY_IMG=$(cat .ray-image.txt)
echo "Built Ray image: $RAY_IMG"
"""

[tasks."test:ray"]
description = "Run patched Ray unit tests inside the patched Ray image for RAY_VARIANT"
depends = ["build:ray"]
run = """
docker run --rm -v "$PWD/tests/ray:/tests:ro" -v "$PWD/third_party/ray/python/ray:/patched:ro" -e RAY_PATCHED_SOURCES=/patched \
  "$(cat .ray-image.txt)" python -m unittest discover -v -s /tests -p 'test_*.py'
"""

[tasks."test:kueue"]
description = "Run unit tests of the packages the Karpenter AdmissionCheck, deployment queue, and topology-aware reclaim patches change"
depends = ["patch:kueue"]
dir = "third_party/kueue"
run = "go test ./pkg/controller/admissionchecks/karpenter/ ./pkg/cache/queue/ ./pkg/controller/jobs/deployment/ ./pkg/scheduler/..."

[tasks."test:kueue-integration"]
description = "Run the patched Kueue topology-aware reclaim integration suite against envtest"
depends = ["patch:kueue"]
dir = "third_party/kueue"
run = """
make test-integration \
  INTEGRATION_TARGET=./test/integration/singlecluster/tas/... \
  INTEGRATION_NPROCS=1 \
  'INTEGRATION_FILTERS=--focus="Topology-aware cohort reclaim"'
"""

[tasks."test:kuberay"]
description = "Run unit tests of the ScaleGate quota clamp and the parallel worker creation the KubeRay patches add, with the race detector"
depends = ["patch:kuberay"]
dir = "third_party/kuberay/ray-operator"
run = "go test -race ./controllers/ray/ -run 'TestScaleGate|TestClusterQueueQuota|TestSlowStartBatch'"

[tasks."test:interlink"]
description = "Run patched interLink virtual kubelet unit tests"
depends = ["patch:interlink"]
dir = "third_party/interlink"
run = "go test ./pkg/virtualkubelet/..."

[tasks.build]
description = "Build all patched images"
depends = ["build:kueue", "build:kuberay", "build:interlink", "build:ray"]

[tasks."publish:kueue"]
description = "Build and publish patched Kueue multi-arch image to GHCR"
depends = ["patch:kueue"]
run = """
TAG="${KUEUE_UPSTREAM}-p${KUEUE_PATCH_VERSION}"
echo "Publishing Kueue image ghcr.io/simonepri/kueue:$TAG..."
docker buildx build --platform linux/amd64,linux/arm64 \
  -f docker/kueue.Dockerfile \
  -t "ghcr.io/simonepri/kueue:$TAG" \
  -t "ghcr.io/simonepri/kueue:latest" \
  --push \
  third_party/kueue
"""

[tasks."publish:kuberay"]
description = "Build and publish patched KubeRay multi-arch image to GHCR"
depends = ["patch:kuberay"]
run = """
TAG="${KUBERAY_UPSTREAM}-p${KUBERAY_PATCH_VERSION}"
echo "Publishing KubeRay image ghcr.io/simonepri/kuberay-operator:$TAG..."
docker buildx build --platform linux/amd64,linux/arm64 \
  -f docker/kuberay.Dockerfile \
  -t "ghcr.io/simonepri/kuberay-operator:$TAG" \
  -t "ghcr.io/simonepri/kuberay-operator:latest" \
  --push \
  third_party/kuberay/ray-operator
"""

[tasks."publish:interlink"]
description = "Build and publish patched interLink virtual kubelet multi-arch image to GHCR"
depends = ["patch:interlink"]
run = """
TAG="${INTERLINK_UPSTREAM}-p${INTERLINK_PATCH_VERSION}"
echo "Publishing interLink virtual kubelet image ghcr.io/simonepri/interlink-virtual-kubelet:$TAG..."
docker buildx build --platform linux/amd64,linux/arm64 \
  -f docker/interlink.Dockerfile \
  --build-arg VERSION="$TAG" \
  -t "ghcr.io/simonepri/interlink-virtual-kubelet:$TAG" \
  -t "ghcr.io/simonepri/interlink-virtual-kubelet:latest" \
  --push \
  third_party/interlink
"""

[tasks."publish:ray"]
description = "Build and publish the patched Ray image for RAY_VARIANT on RAY_PLATFORMS to GHCR"
depends = ["patch:ray"]
run = """
echo "Publishing Ray image ghcr.io/simonepri/ray:$RAY_IMAGE_TAG from $RAY_BASE_IMAGE for $RAY_PLATFORMS..."
docker buildx build --platform "$RAY_PLATFORMS" \
  -f docker/ray.Dockerfile \
  --build-arg BASE_IMAGE="$RAY_BASE_IMAGE" \
  -t "ghcr.io/simonepri/ray:$RAY_IMAGE_TAG" \
  --push \
  third_party/ray
"""

[tasks.publish]
description = "Build and publish all patched images to GHCR"
depends = ["publish:kueue", "publish:kuberay", "publish:interlink", "publish:ray"]

[tasks."cluster:up"]
description = "Spin up Kind cluster and deploy patched controllers directly"
depends = ["build"]
run = """
# 1. Ensure container runtime is running (starts Colima on macOS if docker daemon is inactive)
if ! docker info >/dev/null 2>&1; then
  if command -v colima >/dev/null 2>&1; then
    echo "Starting Colima runtime..."
    colima start --cpu 4 --memory 8 || true
  fi
fi

# 2. Create Kind cluster if not already running
if ! kind get clusters | grep -q "^$CLUSTER_NAME$"; then
  echo "Creating Kind cluster $CLUSTER_NAME..."
  kind create cluster --config kind-config.yaml --name "$CLUSTER_NAME"
fi

# 3. Sideload patched images into Kind first
KUEUE_IMG=$(cat .kueue-image.txt)
KUBERAY_IMG=$(cat .kuberay-image.txt)
echo "Loading images into Kind..."
kind load docker-image "$KUEUE_IMG" --name "$CLUSTER_NAME"
kind load docker-image "$KUBERAY_IMG" --name "$CLUSTER_NAME"

# 4. Install CRDs
echo "Installing base CRDs..."
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayclusters.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayjobs.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayservices.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodeclaims.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodepools.yaml

# 5. Install KubeRay operator directly with patched image, ko entrypoint, and RBAC
echo "Installing KubeRay operator with patched image..."
helm repo add kuberay https://ray-project.github.io/kuberay-helm/ || true
helm repo update
helm template kuberay-operator kuberay/kuberay-operator \
  --version $KUBERAY_UPSTREAM \
  --set image.repository="${KUBERAY_IMG%:*}" \
  --set image.tag="${KUBERAY_IMG##*:}" \
  --set leaderElectionEnabled=false \
  --set env[0].name=KUBERAY_SPOT_INTERRUPTION_NOTICES \
  --set-string env[0].value=true \
  --set resources.limits.cpu=2 \
  --set resources.limits.memory=2Gi \
  --set resources.requests.cpu=500m \
  --set resources.requests.memory=512Mi \
  -n default | \
  sed -e "s| - /manager| - /ko-app/ray-operator|g" | \
  kubectl apply --server-side --force-conflicts -f -

cat << EOF | kubectl apply --server-side --force-conflicts -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberay-operator-extra
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues", "localqueues", "cohorts", "workloads", "workloads/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberay-operator-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberay-operator-extra
subjects:
- kind: ServiceAccount
  name: kuberay-operator
  namespace: default
EOF

# 6. Install Kueue manifests directly patched with sed (image, ko entrypoint), the ConcurrentAdmission feature gate
#    the Karpenter AdmissionCheck requires, and the Karpenter RBAC
echo "Installing Kueue manifests with patched image..."
curl -sL "https://github.com/kubernetes-sigs/kueue/releases/download/$KUEUE_UPSTREAM/manifests.yaml" | \
  sed -e "s|registry.k8s.io/kueue/kueue:$KUEUE_UPSTREAM|$KUEUE_IMG|g" \
      -e "s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g" \
      -e "s| - /manager| - /ko-app/kueue|g" | \
  kubectl apply --server-side --force-conflicts -f -

cat << EOF | kubectl apply --server-side --force-conflicts -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kueue-karpenter-nodeclaims
rules:
- apiGroups: ["karpenter.sh"]
  resources: ["nodeclaims"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: ["karpenter.sh"]
  resources: ["nodepools"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kueue-karpenter-nodeclaims
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kueue-karpenter-nodeclaims
subjects:
- kind: ServiceAccount
  name: kueue-controller-manager
  namespace: kueue-system
EOF

kubectl patch deployment/kueue-controller-manager -n kueue-system --type=json \
  -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--feature-gates=ConcurrentAdmission=true"}]'
kubectl set resources deployment/kueue-controller-manager -n kueue-system --limits=memory=2Gi --requests=memory=512Mi

# 7. Wait for rollouts
kubectl rollout status deployment/kueue-controller-manager -n kueue-system --timeout=180s
kubectl rollout status deployment/kuberay-operator -n default --timeout=180s

# 8. Wait until every webhook the scenarios call accepts a server-side dry run
probe() {
  manifest=$(cat)
  for i in $(seq 1 120); do
    if echo "$manifest" | kubectl create --dry-run=server -f - >/dev/null 2>&1; then
      return 0
    fi
    sleep 1
  done
  echo "Webhook probe $1 did not succeed within 120s" >&2
  exit 1
}
echo "Waiting for Kueue and KubeRay webhooks to accept requests..."
probe resourceflavor <<EOF
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: webhook-probe
EOF
probe clusterqueue <<EOF
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: webhook-probe
spec:
  resourceGroups: []
EOF
probe localqueue <<EOF
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: webhook-probe
  namespace: default
spec:
  clusterQueue: webhook-probe
EOF
probe pod <<EOF
apiVersion: v1
kind: Pod
metadata:
  name: webhook-probe
  namespace: default
spec:
  containers:
    - name: probe
      image: busybox:latest
EOF
probe raycluster <<EOF
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: webhook-probe
  namespace: default
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
EOF
echo "Kueue and KubeRay webhooks are ready!"

echo "Cluster $CLUSTER_NAME is ready with patched controllers!"
"""

[tasks."cluster:stock"]
description = "Spin up Kind cluster using official unpatched upstream images"
run = """
# 1. Ensure container runtime is running (starts Colima on macOS if docker daemon is inactive)
if ! docker info >/dev/null 2>&1; then
  if command -v colima >/dev/null 2>&1; then
    echo "Starting Colima runtime..."
    colima start --cpu 4 --memory 8 || true
  fi
fi

# 2. Create Kind cluster if not already running
if ! kind get clusters | grep -q "^$CLUSTER_NAME$"; then
  echo "Creating Kind cluster $CLUSTER_NAME..."
  kind create cluster --config kind-config.yaml --name "$CLUSTER_NAME"
fi

# 3. Install base CRDs
echo "Installing CRDs..."
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayclusters.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayjobs.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayservices.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodeclaims.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodepools.yaml

helm repo add kuberay https://ray-project.github.io/kuberay-helm/ || true
helm repo update
helm template kuberay-operator kuberay/kuberay-operator \
  --version $KUBERAY_UPSTREAM \
  --set leaderElectionEnabled=false \
  --set resources.limits.cpu=2 \
  --set resources.limits.memory=2Gi \
  --set resources.requests.cpu=500m \
  --set resources.requests.memory=512Mi \
  -n default | \
  kubectl apply --server-side --force-conflicts -f -

kubectl apply --server-side --force-conflicts -f https://github.com/kubernetes-sigs/kueue/releases/download/$KUEUE_UPSTREAM/manifests.yaml
kubectl set image deployment/kueue-controller-manager -n kueue-system manager=registry.k8s.io/kueue/kueue:$KUEUE_UPSTREAM

kubectl rollout status deployment/kueue-controller-manager -n kueue-system --timeout=120s
kubectl rollout status deployment/kuberay-operator -n default --timeout=120s
echo "Cluster $CLUSTER_NAME is running STOCK UNPATCHED upstream controllers."
"""

[tasks."cluster:down"]
description = "Tear down the local Kind cluster"
run = "kind delete cluster --name $CLUSTER_NAME"

[tasks.test]
description = "Run full scenario test suite"
run = "chainsaw test tests/scenarios/ --parallel 1 --assert-timeout 60s --cleanup-timeout 120s --force-termination-grace-period 0s"
