[tools]
go = "1.27.3"
kind = "0.33.0"
kubectl = "1.37.2"
"aqua:kyverno/chainsaw" = "0.2.15"
helm = "4.3.1"
ko = "0.19.1"
colima = "0.10.3"
docker-cli = "29.9.3"
jq = "1.8.1"
python = "3.13.3"

[env]
CLUSTER_NAME = "elastic-scale-lab"
# Cluster tasks use only this kubeconfig, never the default one, so they cannot reach a cluster other than the lab.
KUBECONFIG = "{{config_root}}/.local/kind/kubeconfig"
# renovate: datasource=github-releases depName=kubernetes-sigs/kueue
KUEUE_UPSTREAM = "v0.20.6"
# renovate: datasource=github-releases depName=ray-project/kuberay
KUBERAY_UPSTREAM = "v1.7.2"
# renovate: datasource=github-releases depName=kubernetes-sigs/karpenter
KARPENTER_UPSTREAM = "v1.15.1"
# renovate: datasource=github-releases depName=interlink-hq/interLink
INTERLINK_UPSTREAM = "0.6.2"
# renovate: datasource=github-releases depName=ray-project/ray
RAY_UPSTREAM = "2.60.0"
RAY_PYTHON = "py313"
RAY_VARIANT = "{{ get_env(name='RAY_VARIANT', default='') }}"
KUEUE_PATCH_VERSION = "1.2.3"
KUBERAY_PATCH_VERSION = "1.1.0"
INTERLINK_PATCH_VERSION = "1.1.0"
RAY_PATCH_VERSION = "1.1.0"

KUEUE_IMAGE_TAG = "{{env.KUEUE_UPSTREAM}}-p{{env.KUEUE_PATCH_VERSION}}"
KUBERAY_IMAGE_TAG = "{{env.KUBERAY_UPSTREAM}}-p{{env.KUBERAY_PATCH_VERSION}}"
INTERLINK_IMAGE_TAG = "{{env.INTERLINK_UPSTREAM}}-p{{env.INTERLINK_PATCH_VERSION}}"
RAY_BASE_IMAGE = "rayproject/ray:{{env.RAY_UPSTREAM}}-{{env.RAY_PYTHON}}{{env.RAY_VARIANT}}"
RAY_IMAGE_TAG = "{{env.RAY_UPSTREAM}}-{{env.RAY_PYTHON}}{{env.RAY_VARIANT}}-p{{env.RAY_PATCH_VERSION}}"
RAY_LOCAL_VERSION = "{{ get_env(name='RAY_LOCAL_VERSION', default='') }}"
RAY_WHEEL_BASE_URL = "{{ get_env(name='RAY_WHEEL_BASE_URL', default='') }}"
RAY_INSTALL_WHEEL = "{{ get_env(name='RAY_INSTALL_WHEEL', default='0') }}"
RAY_WHEEL_DIR = "{{ get_env(name='RAY_WHEEL_DIR', default='') }}"
KUEUE_FEATURE_GATES = "{{ get_env(name='KUEUE_FEATURE_GATES', default='ConcurrentAdmission=true,ElasticJobsViaWorkloadSlicesWithPartialReplicaScaleUp=true,ElasticJobsViaWorkloadSlicesFlavorChangeFromZero=true,PartialPreemption=true,ElasticJobsViaWorkloadSlicesFlavorSplit=true,KarpenterAdmissionCheck=true,MutableDeploymentQueue=true,VisibilityOnDemand=true,PreSubmissionSimulator=true') }}"

[tasks."patch:kueue"]
description = "Apply patches to third_party/kueue"
run = "build/kueue/patch.sh"

[tasks."patch:kuberay"]
description = "Apply patches to third_party/kuberay"
run = "build/kuberay/patch.sh"

[tasks."patch:interlink"]
description = "Apply patches to third_party/interlink"
run = "build/interlink/patch.sh"

[tasks."patch:ray"]
description = "Apply patches to third_party/ray"
run = "build/ray/patch.sh"

[tasks.patch]
description = "Apply all patches to third_party upstreams"
depends = ["patch:kueue", "patch:kuberay", "patch:interlink", "patch:ray"]

[tasks."build:kueue"]
description = "Build patched Kueue image"
depends = ["patch:kueue"]
run = "build/kueue/build.sh"

[tasks."build:kuberay"]
description = "Build patched KubeRay image"
depends = ["patch:kuberay"]
run = "build/kuberay/build.sh"

[tasks."build:interlink"]
description = "Build patched interLink virtual kubelet image"
depends = ["patch:interlink"]
run = "build/interlink/build.sh"

[tasks."build:ray"]
description = "Build patched Ray images"
depends = ["patch:ray"]
run = "build/ray/build.sh"

[tasks."build:ray-wheel"]
description = "Build Ray wheel with patched C++ binaries"
depends = ["patch:ray"]
run = "build/ray/build-wheel.sh"

[tasks.build]
description = "Build all patched images"
depends = ["build:kueue", "build:kuberay", "build:interlink", "build:ray"]

[tasks."publish:kueue"]
description = "Publish patched Kueue image to GHCR"
run = "build/kueue/publish.sh"

[tasks."publish:kuberay"]
description = "Publish patched KubeRay image to GHCR"
run = "build/kuberay/publish.sh"

[tasks."publish:interlink"]
description = "Publish patched interLink image to GHCR"
run = "build/interlink/publish.sh"

[tasks."publish:ray"]
description = "Publish patched Ray images and wheel to GitHub Release"
run = "build/ray/publish.sh"

[tasks.publish]
description = "Publish all patched images"
depends = ["publish:kueue", "publish:kuberay", "publish:interlink", "publish:ray"]

[tasks."cluster:up"]
description = "Spin up Kind cluster, install CRDs, and deploy patched controllers"
run = "build/cluster/up.sh"

[tasks."cluster:down"]
description = "Tear down local Kind cluster"
run = "kind delete cluster --name {{env.CLUSTER_NAME}} --kubeconfig {{env.KUBECONFIG}}"

[tasks."test:checks"]
description = "Run static analysis and release order assertions"
run = """
python3 tests/checks/check-kind-only-cluster-access.py
python3 tests/checks/check-kueue-setup-rbac.py
python3 tests/checks/check-delayed-topology-bounds.py
bash tests/checks/check-ray-release-order.sh
"""

[tasks."test:interlink"]
description = "Run patched interLink unit tests"
dir = "third_party/interlink"
depends = ["patch:interlink"]
run = "go test ./pkg/virtualkubelet/..."

[tasks."test:kuberay"]
description = "Run patched KubeRay unit tests"
dir = "third_party/kuberay/ray-operator"
depends = ["patch:kuberay"]
run = "go test -race ./controllers/ray/... -skip TestAPIs"

[tasks."test:kueue"]
description = "Run patched Kueue unit tests"
dir = "third_party/kueue"
depends = ["patch:kueue"]
run = "go test -race ./pkg/..."

[tasks."test:kueue-integration"]
description = "Run patched Kueue Ginkgo integration tests"
depends = ["patch:kueue"]
run = "build/kueue/test-integration.sh"

[tasks."test:e2e"]
description = "Run end-to-end integration tests using Chainsaw"
run = [
  "bash build/cluster/require-kind-context.sh",
  "chainsaw test --config tests/e2e/chainsaw-config.yaml tests/e2e/ tests/checks/fixtures/delayed-topology/",
]
