[tools]
go = "1.27.3"
kind = "0.33.0"
kubectl = "1.37.1"
"aqua:kyverno/chainsaw" = "0.2.15"
helm = "4.3.1"
ko = "0.19.1"
colima = "0.10.3"
docker-cli = "29.9.2"

[env]
CLUSTER_NAME = "elastic-scale-lab"

# Upstream versions
# renovate: datasource=github-releases depName=kubernetes-sigs/kueue
KUEUE_UPSTREAM = "v0.20.2"
# renovate: datasource=github-releases depName=ray-project/kuberay
KUBERAY_UPSTREAM = "v1.7.1"
# renovate: datasource=github-releases depName=kubernetes-sigs/karpenter
KARPENTER_UPSTREAM = "v1.15.0"

# Internal patchset versions (tracks release-please manifests)
KUEUE_PATCH_VERSION = "0.3.0"
KUBERAY_PATCH_VERSION = "0.3.0"

# Derived full image tags: <upstream>-p<patch_version>
KUEUE_IMAGE_TAG = "{{env.KUEUE_UPSTREAM}}-p{{env.KUEUE_PATCH_VERSION}}"
KUBERAY_IMAGE_TAG = "{{env.KUBERAY_UPSTREAM}}-p{{env.KUBERAY_PATCH_VERSION}}"

[tasks."clone:kueue"]
description = "Clone upstream Kueue at target version"
run = """
if [ ! -d third_party/kueue/.git ]; then
  mkdir -p third_party
  echo "Cloning Kueue $KUEUE_UPSTREAM..."
  git clone --depth 1 --branch "$KUEUE_UPSTREAM" https://github.com/kubernetes-sigs/kueue.git third_party/kueue
fi
"""

[tasks."clone:kuberay"]
description = "Clone upstream KubeRay at target version"
run = """
if [ ! -d third_party/kuberay/.git ]; then
  mkdir -p third_party
  echo "Cloning KubeRay $KUBERAY_UPSTREAM..."
  git clone --depth 1 --branch "$KUBERAY_UPSTREAM" https://github.com/ray-project/kuberay.git third_party/kuberay
fi
"""

[tasks."patch:kueue"]
description = "Apply patches to third_party/kueue"
depends = ["clone:kueue"]
run = """
cd third_party/kueue
for p in ../../patches/kueue/*.patch; do
  [ -f "$p" ] || continue
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p" || true
done
"""

[tasks."patch:kuberay"]
description = "Apply patches to third_party/kuberay"
depends = ["clone:kuberay"]
run = """
cd third_party/kuberay
for p in ../../patches/kuberay/*.patch; do
  [ -f "$p" ] || continue
  echo "Applying patch $p..."
  git apply --whitespace=nowarn "$p" || true
done
"""

[tasks.patch]
description = "Apply all patches to third_party dependencies"
depends = ["patch:kueue", "patch:kuberay"]

[tasks."build:kueue"]
description = "Build patched Kueue image"
depends = ["patch:kueue"]
run = """
docker build -f docker/kueue.Dockerfile -t kind.local/kueue:$KUEUE_IMAGE_TAG -t kind.local/kueue:latest third_party/kueue
echo "kind.local/kueue:$KUEUE_IMAGE_TAG" > .kueue-image.txt
KUEUE_IMG=$(cat .kueue-image.txt)
echo "Built Kueue image: $KUEUE_IMG"
"""

[tasks."build:kuberay"]
description = "Build patched KubeRay image"
depends = ["patch:kuberay"]
run = """
docker build -f docker/kuberay.Dockerfile -t kind.local/kuberay-operator:$KUBERAY_IMAGE_TAG -t kind.local/kuberay-operator:latest third_party/kuberay/ray-operator
echo "kind.local/kuberay-operator:$KUBERAY_IMAGE_TAG" > .kuberay-image.txt
KUBERAY_IMG=$(cat .kuberay-image.txt)
echo "Built KubeRay image: $KUBERAY_IMG"
"""

[tasks.build]
description = "Build all patched controller images"
depends = ["build:kueue", "build:kuberay"]

[tasks."publish:kueue"]
description = "Build and publish patched Kueue multi-arch image to GHCR"
depends = ["patch:kueue"]
run = """
TAG="${KUEUE_UPSTREAM}-p${KUEUE_PATCH_VERSION}"
echo "Publishing Kueue image ghcr.io/simonepri/kueue:$TAG..."
docker buildx build --platform linux/amd64,linux/arm64 \
  -f docker/kueue.Dockerfile \
  -t "ghcr.io/simonepri/kueue:$TAG" \
  -t "ghcr.io/simonepri/kueue:latest" \
  --push \
  third_party/kueue
"""

[tasks."publish:kuberay"]
description = "Build and publish patched KubeRay multi-arch image to GHCR"
depends = ["patch:kuberay"]
run = """
TAG="${KUBERAY_UPSTREAM}-p${KUBERAY_PATCH_VERSION}"
echo "Publishing KubeRay image ghcr.io/simonepri/kuberay-operator:$TAG..."
docker buildx build --platform linux/amd64,linux/arm64 \
  -f docker/kuberay.Dockerfile \
  -t "ghcr.io/simonepri/kuberay-operator:$TAG" \
  -t "ghcr.io/simonepri/kuberay-operator:latest" \
  --push \
  third_party/kuberay/ray-operator
"""

[tasks.publish]
description = "Build and publish all patched images to GHCR"
depends = ["publish:kueue", "publish:kuberay"]

[tasks."cluster:up"]
description = "Spin up Kind cluster and deploy patched controllers directly"
depends = ["build"]
run = """
# 1. Ensure container runtime is running (starts Colima on macOS if docker daemon is inactive)
if ! docker info >/dev/null 2>&1; then
  if command -v colima >/dev/null 2>&1; then
    echo "Starting Colima runtime..."
    colima start --cpu 4 --memory 8 || true
  fi
fi

# 2. Create Kind cluster if not already running
if ! kind get clusters | grep -q "^$CLUSTER_NAME$"; then
  echo "Creating Kind cluster $CLUSTER_NAME..."
  kind create cluster --config kind-config.yaml --name "$CLUSTER_NAME"
fi

# 3. Sideload patched images into Kind first
KUEUE_IMG=$(cat .kueue-image.txt)
KUBERAY_IMG=$(cat .kuberay-image.txt)
echo "Loading images into Kind..."
kind load docker-image "$KUEUE_IMG" --name "$CLUSTER_NAME"
kind load docker-image "$KUBERAY_IMG" --name "$CLUSTER_NAME"

# 4. Install CRDs
echo "Installing base CRDs..."
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayclusters.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayjobs.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayservices.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodeclaims.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodepools.yaml

# 5. Install KubeRay operator directly with patched image, ko entrypoint, and RBAC
echo "Installing KubeRay operator with patched image..."
helm repo add kuberay https://ray-project.github.io/kuberay-helm/ || true
helm repo update
helm template kuberay-operator kuberay/kuberay-operator \
  --version $KUBERAY_UPSTREAM \
  --set image.repository="${KUBERAY_IMG%:*}" \
  --set image.tag="${KUBERAY_IMG##*:}" \
  --set leaderElectionEnabled=false \
  --set resources.limits.cpu=2 \
  --set resources.limits.memory=2Gi \
  --set resources.requests.cpu=500m \
  --set resources.requests.memory=512Mi \
  -n default | \
  sed -e "s| - /manager| - /ko-app/ray-operator|g" | \
  kubectl apply --server-side --force-conflicts -f -

cat << EOF | kubectl apply --server-side --force-conflicts -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuberay-operator-extra
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues", "localqueues"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuberay-operator-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuberay-operator-extra
subjects:
- kind: ServiceAccount
  name: kuberay-operator
  namespace: default
EOF

# 6. Install Kueue manifests directly patched with sed (image, ko entrypoint, and Karpenter NodeClaim RBAC)
echo "Installing Kueue manifests with patched image..."
curl -sL "https://github.com/kubernetes-sigs/kueue/releases/download/$KUEUE_UPSTREAM/manifests.yaml" | \
  sed -e "s|registry.k8s.io/kueue/kueue:$KUEUE_UPSTREAM|$KUEUE_IMG|g" \
      -e "s|imagePullPolicy: Always|imagePullPolicy: IfNotPresent|g" \
      -e "s| - /manager| - /ko-app/kueue|g" | \
  kubectl apply --server-side --force-conflicts -f -

cat << EOF | kubectl apply --server-side --force-conflicts -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kueue-karpenter-nodeclaims
rules:
- apiGroups: ["karpenter.sh"]
  resources: ["nodeclaims", "nodeclaims/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kueue-karpenter-nodeclaims
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kueue-karpenter-nodeclaims
subjects:
- kind: ServiceAccount
  name: kueue-controller-manager
  namespace: kueue-system
EOF

kubectl set resources deployment/kueue-controller-manager -n kueue-system --limits=memory=2Gi --requests=memory=512Mi

# 7. Wait for rollouts
kubectl rollout status deployment/kueue-controller-manager -n kueue-system --timeout=180s
kubectl rollout status deployment/kuberay-operator -n default --timeout=180s

# 8. Wait for Kueue mutating webhook to become responsive before tests run
echo "Waiting for Kueue webhook service to accept connections..."
for i in $(seq 1 30); do
  if kubectl run --dry-run=server --image=busybox:latest webhook-probe -n default >/dev/null 2>&1; then
    echo "Kueue webhook service is ready!"
    break
  fi
  sleep 1
done

echo "Cluster $CLUSTER_NAME is ready with patched controllers!"
"""

[tasks."cluster:stock"]
description = "Spin up Kind cluster using official unpatched upstream images"
run = """
# 1. Ensure container runtime is running (starts Colima on macOS if docker daemon is inactive)
if ! docker info >/dev/null 2>&1; then
  if command -v colima >/dev/null 2>&1; then
    echo "Starting Colima runtime..."
    colima start --cpu 4 --memory 8 || true
  fi
fi

# 2. Create Kind cluster if not already running
if ! kind get clusters | grep -q "^$CLUSTER_NAME$"; then
  echo "Creating Kind cluster $CLUSTER_NAME..."
  kind create cluster --config kind-config.yaml --name "$CLUSTER_NAME"
fi

# 3. Install base CRDs
echo "Installing CRDs..."
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayclusters.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayjobs.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_UPSTREAM/ray-operator/config/crd/bases/ray.io_rayservices.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodeclaims.yaml
kubectl apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/karpenter/$KARPENTER_UPSTREAM/pkg/apis/crds/karpenter.sh_nodepools.yaml

helm repo add kuberay https://ray-project.github.io/kuberay-helm/ || true
helm repo update
helm template kuberay-operator kuberay/kuberay-operator \
  --version $KUBERAY_UPSTREAM \
  --set leaderElectionEnabled=false \
  --set resources.limits.cpu=2 \
  --set resources.limits.memory=2Gi \
  --set resources.requests.cpu=500m \
  --set resources.requests.memory=512Mi \
  -n default | \
  kubectl apply --server-side --force-conflicts -f -

kubectl apply --server-side --force-conflicts -f https://github.com/kubernetes-sigs/kueue/releases/download/$KUEUE_UPSTREAM/manifests.yaml
kubectl set image deployment/kueue-controller-manager -n kueue-system manager=registry.k8s.io/kueue/kueue:$KUEUE_UPSTREAM

kubectl rollout status deployment/kueue-controller-manager -n kueue-system --timeout=120s
kubectl rollout status deployment/kuberay-operator -n default --timeout=120s
echo "Cluster $CLUSTER_NAME is running STOCK UNPATCHED upstream controllers."
"""

[tasks."cluster:down"]
description = "Tear down the local Kind cluster"
run = "kind delete cluster --name $CLUSTER_NAME"

[tasks.test]
description = "Run full scenario test suite"
run = "chainsaw test tests/scenarios/ --parallel 1 --assert-timeout 60s --cleanup-timeout 120s --force-termination-grace-period 0s"
