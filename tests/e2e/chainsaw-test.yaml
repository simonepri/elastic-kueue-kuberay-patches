apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elastic-ray-full-lifecycle
  labels:
    scenario: canonical-lifecycle
spec:
  concurrent: false
  description: >
    Canonical End-to-End Integration Test for Patched Kueue, Patched KubeRay, and Patched Ray:
    1. Pre-Submission Simulator: Dry-run admission verification via /simulate subresource.
    2. Karpenter JIT Reservation: NodeClaims provisioned with DaemonSet overhead & anti-theft taints.
    3. ScaleGate Clamping: Excess worker scale-up clamped to ClusterQueue quota limit.
    4. Collaborative Partial Preemption: High-priority job triggers worker drain down to minReplicas floor;
       Ray Head pod stays alive; dynamic quota is released as stopped workers terminate.
    5. Two-Way Elastic Regrow: When preemptor job finishes, scale-up probe detects freed quota and regrows
       workers back to full requested capacity without dropping head state.
  catch:
    - events: {}
    - describe:
        apiVersion: ray.io/v1
        kind: RayCluster
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
    - describe:
        apiVersion: v1
        kind: Pod
    - podLogs:
        namespace: kueue-system
        selector: control-plane=controller-manager
        tail: 150
  steps:
    - name: 01-setup-queues-and-priority
      try:
        - apply:
            file: manifests/queues.yaml

    - name: 02-pre-submission-simulation
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              kubectl create --raw "/apis/visibility.kueue.x-k8s.io/v1beta2/namespaces/${NS}/localqueues/elastic-local-queue/simulate" \
                -f manifests/simulate-request.json | jq -e '.status.mode == "Fit"'

    - name: 03-submit-elastic-raycluster
      try:
        - apply:
            file: manifests/raycluster.yaml
        - assert:
            resource:
              apiVersion: karpenter.sh/v1
              kind: NodeClaim
              metadata:
                (labels."kueue.x-k8s.io/workload-namespace"): ($namespace)
                (labels."karpenter.sh/nodepool"): elastic-nodepool
              spec:
                (taints[?key=='karpenter.sh/claimed-by'] | length(@) > `0`): true

    - name: 03-karpenter-launches-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                claims=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name 2>/dev/null || true)
                if [ -n "$claims" ]; then break; fi
                sleep 1
              done
              attempt=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o jsonpath='{.items[-1].metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
              if [ -n "$attempt" ]; then
                kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
              fi
              for nc in $(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name); do
                kubectl patch "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 04-assert-ray-active-and-workers-running
      try:
        - assert:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: elastic-raycluster
              status:
                state: ready
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-raycluster
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/group" == 'workers'])): 3

    - name: 05-trigger-excess-scaleup
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              kubectl -n "${NS}" patch raycluster elastic-raycluster --type=json \
                -p '[{"op":"replace","path":"/spec/workerGroupSpecs/0/replicas","value":10},{"op":"replace","path":"/spec/workerGroupSpecs/0/maxReplicas","value":10}]'

    - name: 06-assert-scalegate-clamped
      try:
        - assert:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: elastic-raycluster
              spec:
                workerGroupSpecs:
                  - groupName: workers
                    maxReplicas: 4
              status:
                (conditions[?type == 'ScaleGateClamped']):
                  - status: "True"

    - name: 06a-launch-scaleup-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                unlaunched=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions == null or (any(.status.conditions[]; .type == "Launched" and .status == "True") | not)) | .metadata.name')
                if [ -n "$unlaunched" ]; then break; fi
                sleep 1
              done
              for nc in $unlaunched; do
                attempt=$(kubectl get nodeclaim "$nc" -o jsonpath='{.metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
                if [ -n "$attempt" ]; then
                  kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
                fi
                kubectl patch nodeclaim "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 06b-assert-scaleup-admitted
      try:
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-raycluster
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true

    - name: 07-submit-high-priority-preemptor
      try:
        - apply:
            file: manifests/preemptor-job.yaml

    - name: 07a-launch-preemptor-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                unlaunched=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o json 2>/dev/null | jq -r '.items[]? | select((.metadata.name | startswith("job-urgent-batch-job")) and (.status.conditions == null or (any(.status.conditions[]; .type == "Launched" and .status == "True") | not))) | .metadata.name')
                if [ -n "$unlaunched" ]; then break; fi
                sleep 1
              done
              for nc in $unlaunched; do
                attempt=$(kubectl get nodeclaim "$nc" -o jsonpath='{.metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
                if [ -n "$attempt" ]; then
                  kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
                fi
                kubectl patch nodeclaim "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 08-assert-partial-preemption-and-head-survival
      try:
        - assert:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: elastic-raycluster
              status:
                (conditions[?type == 'ScaleGateClamped']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-raycluster
              status:
                (reclaimablePods[?name=='workers'].count):
                  - 3
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: urgent-batch-job
              status:
                active: 3
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."job-name" == 'urgent-batch-job'])): 3
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/group" == 'workers'])): 1
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/node-type" == 'head'])): 1

    - name: 10-preemptor-finishes-and-releases-quota
      try:
        - delete:
            ref:
              apiVersion: batch/v1
              kind: Job
              name: urgent-batch-job

    - name: 10a-launch-regrow-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                unlaunched=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions == null or (any(.status.conditions[]; .type == "Launched" and .status == "True") | not)) | .metadata.name')
                if [ -n "$unlaunched" ]; then break; fi
                sleep 1
              done
              for nc in $unlaunched; do
                attempt=$(kubectl get nodeclaim "$nc" -o jsonpath='{.metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
                if [ -n "$attempt" ]; then
                  kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
                fi
                kubectl patch nodeclaim "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 11-assert-scaleup-probe-regrow
      try:
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-raycluster
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/group" == 'workers'])): 4
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elastic-ray-manifest-reapply
  labels:
    scenario: manifest-reapply
spec:
  concurrent: false
  description: >
    Verifies that re-applying an elastic RayCluster manifest (e.g. GitOps synchronization)
    does not strip Kueue workload slice annotations or podset labels from worker templates,
    and that newly created replacement workers are cleanly admitted without gating deadlocks.
  catch:
    - events: {}
    - describe:
        apiVersion: ray.io/v1
        kind: RayCluster
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
    - describe:
        apiVersion: v1
        kind: Pod
  steps:
    - name: 01-setup-queues
      try:
        - apply:
            file: manifests/queues.yaml

    - name: 02-submit-raycluster
      try:
        - apply:
            file: manifests/raycluster.yaml

    - name: 03-launch-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                claims=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name 2>/dev/null || true)
                if [ -n "$claims" ]; then break; fi
                sleep 1
              done
              attempt=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o jsonpath='{.items[-1].metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
              if [ -n "$attempt" ]; then
                kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
              fi
              for nc in $(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name); do
                kubectl patch "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 04-assert-running
      try:
        - assert:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: elastic-raycluster
              status:
                state: ready
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/group" == 'workers'])): 3

    - name: 05-reapply-original-manifest
      try:
        - apply:
            file: manifests/raycluster.yaml

    - name: 06-assert-cluster-intact-and-templates-restamped
      try:
        - assert:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: elastic-raycluster
              status:
                state: ready

    - name: 07-delete-worker-to-trigger-recreation
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              worker_pod=$(kubectl -n "$NS" get pods -l "ray.io/cluster=elastic-raycluster,ray.io/group=workers" -o jsonpath='{.items[0].metadata.name}')
              kubectl -n "$NS" delete pod "$worker_pod" --now

    - name: 08-assert-replacement-worker-admitted
      try:
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."ray.io/group" == 'workers'])): 3
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multihost-gang-scaleup
  labels:
    scenario: multihost-gang
spec:
  concurrent: false
  description: >
    Verifies that multi-host worker groups with numOfHosts > 1 scale only in whole-replica
    gang increments (multiples of numOfHosts), preventing fractional pod allocations.
  catch:
    - events: {}
    - describe:
        apiVersion: ray.io/v1
        kind: RayCluster
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
    - describe:
        apiVersion: v1
        kind: Pod
  steps:
    - name: 01-setup-queues
      try:
        - apply:
            file: manifests/queues.yaml

    - name: 02-submit-multihost-raycluster
      try:
        - apply:
            file: manifests/multihost-raycluster.yaml

    - name: 03-launch-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                claims=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name 2>/dev/null || true)
                if [ -n "$claims" ]; then break; fi
                sleep 1
              done
              attempt=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o jsonpath='{.items[-1].metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
              if [ -n "$attempt" ]; then
                kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
              fi
              for nc in $(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name); do
                kubectl patch "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 04-assert-multihost-gang-allocated
      try:
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: multihost-raycluster
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true
        - assert:
            resource:
              # Must allocate in gang increments of 2 (either 2 or 4 workers admitted, never an odd count, and > 0)
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."ray.io/group" == 'multihost-workers' && !(spec.schedulingGates[?name == 'kueue.x-k8s.io/admission'])]) % `2`): 0
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?metadata.labels."ray.io/group" == 'multihost-workers' && !(spec.schedulingGates[?name == 'kueue.x-k8s.io/admission'])]) > `0`): true
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deployment-queue-in-place-update
  labels:
    scenario: deployment-update
spec:
  concurrent: false
  description: >
    Verifies that updating kueue.x-k8s.io/queue-name or priority class on an active Deployment
    succeeds without webhook rejection and rolls out new pods to the updated queue and priority class.
  catch:
    - events: {}
    - describe:
        apiVersion: apps/v1
        kind: Deployment
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
    - describe:
        apiVersion: v1
        kind: Pod
  steps:
    - name: 01-setup-queues
      try:
        - apply:
            file: manifests/queues.yaml

    - name: 02-submit-deployment
      try:
        - apply:
            file: manifests/deployment.yaml

    - name: 03-assert-deployment-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: queued-serving-deployment
              status:
                readyReplicas: 2

    - name: 04-update-queue-in-place
      try:
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: queued-serving-deployment
                labels:
                  kueue.x-k8s.io/queue-name: standard-local-queue-b
                  kueue.x-k8s.io/priority-class: priority-high

    - name: 05-assert-deployment-updated-and-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: queued-serving-deployment
              status:
                readyReplicas: 2
                updatedReplicas: 2
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."kueue.x-k8s.io/queue-name" == 'standard-local-queue-b' && metadata.labels."kueue.x-k8s.io/priority-class" == 'priority-high'])): 2
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: elastic-flavor-spillover
  labels:
    scenario: flavor-spillover
spec:
  concurrent: false
  description: >
    Verifies that when an elastic workload scales up beyond the capacity of its primary resource flavor,
    Kueue spills remaining workers over to secondary flavors via greedy flavor fill.
  catch:
    - events: {}
    - describe:
        apiVersion: ray.io/v1
        kind: RayCluster
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
  steps:
    - name: 01-setup-multiflavor-queues
      try:
        - apply:
            file: manifests/multiflavor-queues.yaml

    - name: 02-submit-spillover-raycluster
      try:
        - apply:
            resource:
              apiVersion: ray.io/v1
              kind: RayCluster
              metadata:
                name: spillover-raycluster
                labels:
                  kueue.x-k8s.io/queue-name: multiflavor-local-queue
                  kueue.x-k8s.io/priority-class: priority-low
                annotations:
                  kueue.x-k8s.io/elastic-job: "true"
                  kueue.x-k8s.io/elastic-job-scale-up-strategy: partial
              spec:
                rayVersion: "2.60.0"
                headGroupSpec:
                  rayStartParams: {}
                  template:
                    spec:
                      containers:
                        - name: ray-head
                          image: kind.local/ray:latest
                          resources:
                            requests:
                              cpu: "500m"
                              memory: "512Mi"
                workerGroupSpecs:
                  - groupName: workers
                    rayStartParams: {}
                    replicas: 3
                    minReplicas: 1
                    maxReplicas: 6
                    template:
                      spec:
                        containers:
                          - name: ray-worker
                            image: kind.local/ray:latest
                            resources:
                              requests:
                                cpu: "1"
                                memory: "1Gi"

    - name: 03-assert-admitted-across-flavors
      try:
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: spillover-raycluster
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: spillover-raycluster
              status:
                (admission.podSetAssignments[?flavors.cpu=='flavor-primary'] | length(@) > `0`): true
                (admission.podSetAssignments[?flavors.cpu=='flavor-secondary'] | length(@) > `0`): true
                (length(admission.podSetAssignments[?contains(name, 'workers')])): 2
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rayjob-partial-preemption
  labels:
    scenario: rayjob-preemption
spec:
  concurrent: false
  description: >
    Verifies that a RayJob workload running with elastic worker groups undergoes partial
    worker preemption down to minReplicas without terminating the job driver or head pod.
  catch:
    - events: {}
    - describe:
        apiVersion: ray.io/v1
        kind: RayJob
    - describe:
        apiVersion: ray.io/v1
        kind: RayCluster
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
    - describe:
        apiVersion: v1
        kind: Pod
  steps:
    - name: 01-setup-queues
      try:
        - apply:
            file: manifests/queues.yaml

    - name: 02-submit-rayjob
      try:
        - apply:
            file: manifests/rayjob.yaml

    - name: 03-launch-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                claims=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name 2>/dev/null || true)
                if [ -n "$claims" ]; then break; fi
                sleep 1
              done
              attempt=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o jsonpath='{.items[-1].metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
              if [ -n "$attempt" ]; then
                kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
              fi
              for nc in $(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o name); do
                kubectl patch "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 04-assert-rayjob-workload-admitted
      try:
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-rayjob
              status:
                (conditions[?type=='Admitted' && status=='True'] | length(@) > `0`): true

    - name: 05-submit-high-priority-preemptor
      try:
        - apply:
            file: manifests/preemptor-job.yaml

    - name: 05a-launch-preemptor-nodeclaims
      try:
        - script:
            timeout: 30s
            env:
              - name: NS
                value: ($namespace)
            content: |
              node_name=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
              for i in $(seq 1 30); do
                unlaunched=$(kubectl get nodeclaims -l "kueue.x-k8s.io/workload-namespace=${NS}" -o json 2>/dev/null | jq -r '.items[]? | select((.metadata.name | startswith("job-urgent-batch-job")) and (.status.conditions == null or (any(.status.conditions[]; .type == "Launched" and .status == "True") | not))) | .metadata.name')
                if [ -n "$unlaunched" ]; then break; fi
                sleep 1
              done
              for nc in $unlaunched; do
                attempt=$(kubectl get nodeclaim "$nc" -o jsonpath='{.metadata.labels.kueue\.x-k8s\.io/karpenter-attempt}' 2>/dev/null || true)
                if [ -n "$attempt" ]; then
                  kubectl label node "$node_name" "kueue.x-k8s.io/karpenter-attempt=${attempt}" --overwrite
                fi
                kubectl patch nodeclaim "$nc" --subresource=status --type=merge \
                  -p "{\"status\":{\"conditions\":[{\"type\":\"Launched\",\"status\":\"True\",\"reason\":\"Launched\",\"lastTransitionTime\":\"2026-01-01T00:00:00Z\"}],\"nodeName\":\"${node_name}\"}}"
              done

    - name: 06-assert-partial-preemption-and-job-survival
      try:
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: urgent-batch-job
              status:
                active: 3
        - assert:
            resource:
              (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?status.phase == 'Running' && metadata.labels."job-name" == 'urgent-batch-job'])): 3
        - assert:
            resource:
              apiVersion: kueue.x-k8s.io/v1beta2
              kind: Workload
              metadata:
                ownerReferences:
                  - name: elastic-rayjob
              status:
                (reclaimablePods[?name=='workers'].count):
                  - 2
