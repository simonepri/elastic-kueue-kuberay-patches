apiVersion: batch/v1
kind: Job
metadata:
  name: urgent-batch-job
  labels:
    kueue.x-k8s.io/queue-name: elastic-local-queue
    kueue.x-k8s.io/priority-class: priority-high
spec:
  parallelism: 3
  completions: 3
  template:
    spec:
      priorityClassName: priority-high
      containers:
        - name: worker
          image: busybox:latest
          command: ["sleep", "120"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      restartPolicy: Never
