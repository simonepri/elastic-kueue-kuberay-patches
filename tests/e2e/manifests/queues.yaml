apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-low
value: 100
globalDefault: false
description: "Low priority elastic ray workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-high
value: 1000
globalDefault: false
description: "High priority preemptor workloads"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: priority-low
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: priority-high
value: 1000
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: elastic-nodepool
spec:
  template:
    metadata:
      labels:
        instance-type: standard
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default-class
      requirements:
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]
        - key: karpenter.k8s.aws/instance-memory
          operator: In
          values: ["16384", "32768", "65536"]
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: elastic-flavor
spec:
  nodeLabels:
    karpenter.sh/nodepool: elastic-nodepool
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: karpenter-provision
spec:
  controllerName: kueue.x-k8s.io/karpenter
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: elastic-cluster-queue
spec:
  namespaceSelector: {}
  admissionChecksStrategy:
    admissionChecks:
      - name: karpenter-provision
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: elastic-flavor
          resources:
            - name: "cpu"
              nominalQuota: "1250m"
            - name: "memory"
              nominalQuota: "4Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: elastic-local-queue
spec:
  clusterQueue: elastic-cluster-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: standard-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: standard-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: standard-flavor
          resources:
            - name: "cpu"
              nominalQuota: "5"
            - name: "memory"
              nominalQuota: "10Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: standard-local-queue
spec:
  clusterQueue: standard-cluster-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: standard-local-queue-b
spec:
  clusterQueue: standard-cluster-queue
