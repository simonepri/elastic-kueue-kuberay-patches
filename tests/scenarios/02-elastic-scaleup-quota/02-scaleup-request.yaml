apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: dynamic-ray-pipeline
spec:
  workerGroupSpecs:
    - groupName: workers
      replicas: 8
      template:
        spec:
          containers:
            - name: ray-worker
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
