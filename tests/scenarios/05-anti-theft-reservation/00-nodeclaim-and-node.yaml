apiVersion: v1
kind: Node
metadata:
  name: simulated-gpu-node-01
  labels:
    node.kubernetes.io/instance-type: g5.xlarge
    topology.kubernetes.io/zone: us-west-2a
spec:
  taints:
    - key: kueue.x-k8s.io/claimed-by
      value: training-workload-xyz
      effect: NoSchedule
---
apiVersion: karpenter.sh/v1
kind: NodeClaim
metadata:
  name: simulated-claim-01
  labels:
    setu.kueue.x-k8s.io/gang-id: gang-xyz
spec:
  nodeClassRef:
    group: karpenter.k8s.aws
    kind: EC2NodeClass
    name: default
  requirements:
    - key: kubernetes.io/os
      operator: In
      values: ["linux"]
    - key: karpenter.sh/capacity-type
      operator: In
      values: ["on-demand"]
