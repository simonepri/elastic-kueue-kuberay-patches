apiVersion: v1
kind: Pod
metadata:
  name: intended-gang-pod
spec:
  terminationGracePeriodSeconds: 0
  tolerations:
    - key: kueue.x-k8s.io/claimed-by
      operator: Equal
      value: training-workload-xyz
      effect: NoSchedule
  containers:
    - name: worker
      image: busybox:latest
      command: ["sleep", "300"]
  nodeSelector:
    topology.kubernetes.io/zone: us-west-2a
