apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-cohort-low
value: 100
globalDefault: false
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-cohort-high
value: 1000
globalDefault: false
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: pc-cohort-low
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: pc-cohort-high
value: 1000
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: cohort-flavor
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cohort-queue-a
spec:
  cohort: shared-cohort
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: cohort-flavor
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "4"
              borrowingLimit: "4"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cohort-queue-b
spec:
  cohort: shared-cohort
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: cohort-flavor
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "4"
              borrowingLimit: "4"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: lq-team-a
spec:
  clusterQueue: cohort-queue-a
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: lq-team-b
spec:
  clusterQueue: cohort-queue-b
