apiVersion: v1
kind: Node
metadata:
  name: virtual-gpu-node-01
  labels:
    node.kubernetes.io/instance-type: remote-gpu
    topology.kubernetes.io/region: remote-region
status:
  capacity:
    cpu: "32"
    memory: "128Gi"
    nvidia.com/gpu: "8"
  allocatable:
    cpu: "32"
    memory: "128Gi"
    nvidia.com/gpu: "8"
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: local-head-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: remote-gpu-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: remote-gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: distributed-cluster-queue
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: local-head-flavor
          resources:
            - name: "cpu"
              nominalQuota: "32"
            - name: "memory"
              nominalQuota: "128Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
        - name: remote-gpu-flavor
          resources:
            - name: "cpu"
              nominalQuota: "32"
            - name: "memory"
              nominalQuota: "128Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "8"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: distributed-local-queue
spec:
  clusterQueue: distributed-cluster-queue
