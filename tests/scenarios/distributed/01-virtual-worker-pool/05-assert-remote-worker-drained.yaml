apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: distributed-ray-cluster
spec:
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
  workerGroupSpecs:
    - groupName: local-workers
      replicas: 2
      maxReplicas: 4
    - groupName: remote-workers
      replicas: 3
      maxReplicas: 8
