apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: primary-spot-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: spot-primary
    topology.kubernetes.io/region: us-east-1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: secondary-spot-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: spot-secondary
    topology.kubernetes.io/region: us-west-2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: spot-cascade-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: primary-spot-flavor
          resources:
            - name: "cpu"
              nominalQuota: 0
            - name: "memory"
              nominalQuota: 0
        - name: secondary-spot-flavor
          resources:
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 32Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: spot-cascade-local-queue
spec:
  clusterQueue: spot-cascade-cluster-queue
