apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: spot-cascade-cluster
status:
  desiredWorkerReplicas: 2
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    ray.io/cluster: spot-cascade-cluster
    ray.io/node-type: worker
spec:
  nodeSelector:
    node.kubernetes.io/instance-type: spot-secondary
    topology.kubernetes.io/region: us-west-2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
status:
  admission:
    clusterQueue: spot-cascade-cluster-queue
    podSetAssignments:
      - name: head
        flavors:
          cpu: secondary-spot-flavor
      - name: workers
        flavors:
          cpu: secondary-spot-flavor
