apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-spot-elastic-low
value: 100
globalDefault: false
description: "Low priority for elastic background workload"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-spot-elastic-high
value: 1000
globalDefault: false
description: "High priority for spot preemption workload"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: pc-spot-elastic-low
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: pc-spot-elastic-high
value: 1000
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: local-head-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: remote-spot-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: spot-gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: spot-elastic-cluster-queue
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: local-head-flavor
          resources:
            - name: "cpu"
              nominalQuota: "32"
            - name: "memory"
              nominalQuota: "128Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
        - name: remote-spot-flavor
          resources:
            - name: "cpu"
              nominalQuota: "32"
            - name: "memory"
              nominalQuota: "128Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "4"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: spot-elastic-local-queue
spec:
  clusterQueue: spot-elastic-cluster-queue
