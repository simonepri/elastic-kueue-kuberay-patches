apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: spot-elastic-raycluster
  labels:
    kueue.x-k8s.io/queue-name: spot-elastic-local-queue
    kueue.x-k8s.io/priority-class: pc-spot-elastic-low
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        priorityClassName: pc-spot-elastic-low
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "2"
                memory: "4Gi"
  workerGroupSpecs:
    - groupName: remote-workers
      replicas: 4
      minReplicas: 2
      maxReplicas: 8
      rayStartParams: {}
      template:
        spec:
          priorityClassName: pc-spot-elastic-low
          nodeSelector:
            node.kubernetes.io/instance-type: spot-gpu
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
    - groupName: local-workers
      replicas: 2
      maxReplicas: 4
      rayStartParams: {}
      template:
        spec:
          priorityClassName: pc-spot-elastic-low
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
