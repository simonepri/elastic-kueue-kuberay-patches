# ScaleGate caps maxReplicas at the 4 GPUs the quota holds, so the operator plans 4 workers whatever replicas says.
# replicas is not asserted: ScaleGate does not write it.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: giant-scaleup-raycluster
spec:
  workerGroupSpecs:
    - groupName: gpu-workers
      maxReplicas: 4
status:
  desiredWorkerReplicas: 4
  (conditions[?type == 'ScaleGateClamped']):
    - status: "True"
