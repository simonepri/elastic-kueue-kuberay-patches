apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell1-raycluster-local
  labels:
    kueue.x-k8s.io/queue-name: cell1-local-lq
    ray.io/cluster: cell1-raycluster-local
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
  workerGroupSpecs:
    - groupName: local-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 2
      rayStartParams: {}
      template:
        spec:
          nodeSelector:
            cell.boltz.bio/name: cell-1
            node-tier: local
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "2"
                  memory: "8Gi"
                  nvidia.com/gpu: "1"
