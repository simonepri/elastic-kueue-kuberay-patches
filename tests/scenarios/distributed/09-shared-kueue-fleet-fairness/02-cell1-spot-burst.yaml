apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell1-raycluster-spot
  labels:
    kueue.x-k8s.io/queue-name: fleet-cell1-spot-lq
    kueue.x-k8s.io/priority-class: pc-spot-low
    ray.io/cluster: cell1-raycluster-spot
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
  workerGroupSpecs:
    - groupName: spot-workers
      replicas: 6
      minReplicas: 4
      maxReplicas: 8
      rayStartParams: {}
      template:
        spec:
          nodeSelector:
            cell.example.com/name: cell-1
            node-tier: spot
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "2"
                  memory: "8Gi"
                  nvidia.com/gpu: "1"
