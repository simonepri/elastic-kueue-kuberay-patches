# Cell 1 keeps its replicas and its admission: the reclaim target of its 4 nominal workers returns the 2 borrowed
# GPUs once the Pods above it are gone, so its queue charges only its nominal share.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell1-raycluster-spot
spec:
  workerGroupSpecs:
    - groupName: spot-workers
      replicas: 6
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  ownerReferences:
    - name: cell1-raycluster-spot
  annotations:
    kueue.x-k8s.io/reclaim-target-counts: spot-workers=4
status:
  (admission.podSetAssignments[?name=='spot-workers'].count | [0]): 6
  (reclaimablePods[?name=='spot-workers'].count | [0]): 2
  (conditions[?type=='Evicted' && status=='True'] | length(@)): 0
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell2-raycluster-spot
status:
  desiredWorkerReplicas: 4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fleet-cell1-spot-cq
status:
  flavorsReservation:
    - name: local-head-flavor
      resources:
        - name: cpu
          total: "1"
        - name: memory
          total: "2Gi"
        - name: nvidia.com/gpu
          total: "0"
    - name: spot-fleet-flavor
      resources:
        - name: cpu
          total: "8"
        - name: memory
          total: "32Gi"
        - name: nvidia.com/gpu
          borrowed: "0"
          total: "4"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fleet-cell2-spot-cq
status:
  flavorsReservation:
    - name: local-head-flavor
      resources:
        - name: cpu
          total: "1"
        - name: memory
          total: "2Gi"
        - name: nvidia.com/gpu
          total: "0"
    - name: spot-fleet-flavor
      resources:
        - name: cpu
          total: "8"
        - name: memory
          total: "32Gi"
        - name: nvidia.com/gpu
          borrowed: "0"
          total: "4"
