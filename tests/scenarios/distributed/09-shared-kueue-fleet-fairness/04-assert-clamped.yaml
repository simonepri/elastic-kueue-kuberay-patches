# ScaleGate caps maxReplicas at the 8 GPUs cell 2 can reach: its 4 nominal plus a borrowingLimit of 4.
# replicas is not asserted: ScaleGate does not write it.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell2-raycluster-spot
spec:
  workerGroupSpecs:
    - groupName: spot-workers
      maxReplicas: 8
status:
  (conditions[?type == 'ScaleGateClamped']):
    - status: "True"
