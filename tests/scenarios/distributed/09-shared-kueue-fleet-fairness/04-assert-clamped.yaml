# The scale gate clamps the burst to the 8 workers the queue's quota allows.
# The cluster is not an elastic job, so Kueue requeues it at its new size
# instead of letting it run beyond its admission.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: cell2-raycluster-spot
spec:
  workerGroupSpecs:
    - groupName: spot-workers
      replicas: 8
      maxReplicas: 8
