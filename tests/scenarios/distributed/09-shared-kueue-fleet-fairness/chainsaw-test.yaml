apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 19-shared-kueue-fleet-fairness
spec:
  description: >
    Verifies the two-tier fleet queue architecture:
    1. Tier 1: Local physical cell nodes are managed 100% autonomously by the local cell's Kueue.
    2. Tier 2: The InterLink spot fleet is managed by a Shared Kueue on the control cluster with cohort fair-sharing.
    When Cell 1 scales up and Cell 2 is idle, Cell 1 borrows spot quota beyond its nominal share.
    When Cell 2 arrives and then asks for more than the fleet can hold, ScaleGate clamps it.
    The cohort reclaim that contracts Cell 1 is checked in 11-shared-kueue-fleet-fair-reclaim.
  steps:
    - name: setup-queues-and-cohorts
      try:
        - apply:
            file: 00-queues-and-cohorts.yaml
    - name: run-cell1-local-workload
      try:
        - apply:
            file: 01-cell1-local-workload.yaml
        - assert:
            file: 01-assert-cell1-local.yaml
    - name: trigger-cell1-spot-burst
      try:
        - apply:
            file: 02-cell1-spot-burst.yaml
        - assert:
            file: 02-assert-cell1-burst.yaml
    - name: cell2-arrives
      try:
        - apply:
            file: 03-cell2-spot-arrival.yaml
    - name: prevent-overcapacity-burst
      try:
        - apply:
            file: 04-cell2-overcapacity-attempt.yaml
        - assert:
            file: 04-assert-clamped.yaml
