apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 19-shared-kueue-fleet-fairness
spec:
  description: >
    Verifies the two-tier fleet queue architecture:
    1. Tier 1: Local physical cell nodes are managed 100% autonomously by the local cell's Kueue.
    2. Tier 2: The InterLink spot fleet is managed by a Shared Kueue on the control cluster with cohort fair-sharing.
    When Cell 1 scales up and Cell 2 is idle, Cell 1 borrows spot quota beyond its nominal share.
    When Cell 2 arrives requesting its nominal share, Kueue triggers cohort reclaim, contracting
    Cell 1 and granting Cell 2 its fair share without split-capacity deadlocks or over-subscription.
  steps:
    - name: setup-queues-and-cohorts
      try:
        - apply:
            file: 00-queues-and-cohorts.yaml
    - name: run-cell1-local-workload
      try:
        - apply:
            file: 01-cell1-local-workload.yaml
        - assert:
            file: 01-assert-cell1-local.yaml
    - name: trigger-cell1-spot-burst
      try:
        - apply:
            file: 02-cell1-spot-burst.yaml
        - assert:
            file: 02-assert-cell1-burst.yaml
    - name: cell2-arrives-and-reclaims-fair-share
      try:
        - apply:
            file: 03-cell2-spot-arrival.yaml
        - assert:
            file: 03-assert-fair-reclaim.yaml
    - name: prevent-overcapacity-burst
      try:
        - apply:
            file: 04-cell2-overcapacity-attempt.yaml
        - assert:
            file: 04-assert-clamped.yaml
        # cell2 is an elastic job: the resize waits for a new Workload slice, and
        # no more worker pods may run than the admitted slice grants.
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-workers-within-admission.sh cell2-raycluster-spot spot-workers
      catch:
        - get:
            apiVersion: ray.io/v1
            kind: RayCluster
            name: cell2-raycluster-spot
            format: yaml
        - get:
            apiVersion: kueue.x-k8s.io/v1beta2
            kind: Workload
            format: yaml
        - podLogs:
            namespace: default
            selector: app.kubernetes.io/name=kuberay-operator
            tail: 300
