apiVersion: batch/v1
kind: Job
metadata:
  name: opportunistic-burst-job
  labels:
    kueue.x-k8s.io/queue-name: interlink-cloudvm-local-queue
    kueue.x-k8s.io/priority-class: pc-cloudvm-low
spec:
  parallelism: 2
  completions: 2
  template:
    spec:
      terminationGracePeriodSeconds: 0
      priorityClassName: pc-cloudvm-low
      nodeSelector:
        node.kubernetes.io/instance-type: interlink-cloudvm
      containers:
        - name: trainer
          image: busybox:latest
          command: ["sleep", "120"]
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
      restartPolicy: Never
