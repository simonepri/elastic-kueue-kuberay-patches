apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: hybrid-interlink-raycluster
spec:
  workerGroupSpecs:
    - groupName: interlink-spot-workers
      replicas: 2
      maxReplicas: 4
    - groupName: local-workers
      replicas: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opportunistic-burst-job
status:
  (startTime != null): true
