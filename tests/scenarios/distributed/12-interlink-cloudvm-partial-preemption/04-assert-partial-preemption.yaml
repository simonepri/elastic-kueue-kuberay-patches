# Partial preemption shrinks the InterLink worker group to minReplicas without touching replicas: the Workload carries
# the reclaim target and releases the quota of the 2 workers above it once their 15s termination grace has run out.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: hybrid-interlink-raycluster
spec:
  workerGroupSpecs:
    - groupName: interlink-spot-workers
      replicas: 4
    - groupName: local-workers
      replicas: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  ownerReferences:
    - name: hybrid-interlink-raycluster
  annotations:
    kueue.x-k8s.io/reclaim-target-counts: interlink-spot-workers=2
status:
  (admission.podSetAssignments[?name=='interlink-spot-workers'].count | [0]): 4
  (reclaimablePods[?name=='interlink-spot-workers'].count | [0]): 2
  (conditions[?type=='Evicted' && status=='True'] | length(@)): 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: high-priority-burst-job
spec:
  suspend: false
