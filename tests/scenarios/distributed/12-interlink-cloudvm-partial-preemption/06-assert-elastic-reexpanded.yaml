# Once the burst job is gone, a scale-up probe admits all 4 InterLink workers again; replicas never changed.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: hybrid-interlink-raycluster
spec:
  workerGroupSpecs:
    - groupName: interlink-spot-workers
      replicas: 4
    - groupName: local-workers
      replicas: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  ownerReferences:
    - name: hybrid-interlink-raycluster
  annotations:
    (contains(keys(@), 'kueue.x-k8s.io/workload-slice-replacement-for')): true
    (contains(keys(@), 'kueue.x-k8s.io/reclaim-target-counts')): false
status:
  (admission.podSetAssignments[?name=='interlink-spot-workers'].count | [0]): 4
  (conditions[?type=='Finished'] | length(@)): 0
