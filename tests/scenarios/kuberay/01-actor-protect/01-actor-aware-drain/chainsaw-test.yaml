apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 08-actor-aware-drain
spec:
  description: >
    Verifies stateful actor-aware worker protection: the coordinator dynamically
    labels and scores worker pods with controller.kubernetes.io/pod-deletion-cost
    so Kubernetes downscaling deletes idle workers and preserves busy stateful actors.
  steps:
    - name: create-worker-pods
      try:
        - apply:
            file: 00-worker-pods.yaml
    - name: assert-deletion-cost-injected
      try:
        - assert:
            file: 01-assert-deletion-costs.yaml
