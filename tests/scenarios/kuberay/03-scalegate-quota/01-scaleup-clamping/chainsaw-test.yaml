apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 02-elastic-scaleup-quota-backpressure
spec:
  description: >
    Verifies that when a RayCluster attempts to scale beyond Kueue ClusterQueue quota limits,
    the ScaleGate dynamically clamps the workerGroup request to available quota, providing
    backpressure to Ray instead of triggering infinite pod thrashing and deletion loops.
  steps:
    - name: setup-capped-queue
      try:
        - apply:
            file: 00-queue.yaml
    - name: start-baseline-ray-cluster
      try:
        - apply:
            file: 01-raycluster.yaml
        - assert:
            file: 01-assert-baseline.yaml
    - name: trigger-excessive-scaleup
      try:
        - apply:
            file: 02-scaleup-request.yaml
    - name: assert-scalegate-clamped-replicas
      try:
        - assert:
            file: 03-assert-clamped.yaml
