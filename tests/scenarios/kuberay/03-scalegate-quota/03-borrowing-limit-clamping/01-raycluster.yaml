# An elastic GPU worker group that may grow to 16 workers.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: elastic-borrower
  labels:
    kueue.x-k8s.io/queue-name: sg-limit-local-queue
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "1"
                memory: "1Gi"
  workerGroupSpecs:
    - groupName: gpu-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 16
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "1"
                  memory: "1Gi"
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
