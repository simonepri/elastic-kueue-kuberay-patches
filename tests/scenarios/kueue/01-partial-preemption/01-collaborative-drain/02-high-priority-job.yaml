apiVersion: batch/v1
kind: Job
metadata:
  name: urgent-training-job
  labels:
    kueue.x-k8s.io/queue-name: shared-local-queue
    kueue.x-k8s.io/priority-class: priority-high
spec:
  parallelism: 2
  completions: 2
  template:
    spec:
      priorityClassName: priority-high
      containers:
        - name: train
          image: busybox:latest
          command: ["sleep", "120"]
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
      restartPolicy: Never
