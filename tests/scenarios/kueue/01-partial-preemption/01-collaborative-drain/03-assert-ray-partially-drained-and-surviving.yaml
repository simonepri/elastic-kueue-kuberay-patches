# Partial preemption shrinks the pipeline without touching replicas: its Workload carries a reclaim
# target of 6 workers and releases the quota of the 2 workers above it once their Pods are gone.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-data-pipeline
spec:
  workerGroupSpecs:
    - groupName: workers
      replicas: 8
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  ownerReferences:
    - name: ray-data-pipeline
  annotations:
    kueue.x-k8s.io/reclaim-target-counts: workers=6
status:
  (admission.podSetAssignments[?name=='workers'].count | [0]): 8
  (reclaimablePods[?name=='workers'].count | [0]): 2
  (conditions[?type=='Evicted' && status=='True'] | length(@)): 0
