apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 03-collaborative-partial-preemption
  labels:
    partial-preemption: required
spec:
  description: >
    Verifies that when a high-priority workload requires quota currently borrowed by a lower-priority
    RayData pipeline, collaborative partial preemption reclaims the necessary workers voluntarily,
    preventing Kueue from evicting the entire Ray cluster and destroying in-memory pipeline state.
    The pipeline keeps its replicas; Kueue deletes the worker Pods above the reclaim target, KubeRay
    recreates them gated, and the preemptor is admitted only after the deleted Pods are gone.
  catch:
    - script:
        env:
          - name: NS
            value: ($namespace)
        content: ../../../dump-namespace.sh
  steps:
    - name: setup-priority-queues
      try:
        - apply:
            file: 00-queues-and-priorities.yaml
    - name: run-low-priority-ray-pipeline
      try:
        - apply:
            file: 01-low-priority-ray.yaml
        - assert:
            file: 01-assert-ray-active.yaml
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ../../../assert-worker-pods.sh ray-data-pipeline workers 8 0
    - name: submit-high-priority-preemptor
      try:
        - apply:
            file: 02-high-priority-job.yaml
        - script:
            timeout: 90s
            env:
              - name: NS
                value: ($namespace)
            content: ../../../assert-reclaimed-before-admission.sh ray-data-pipeline workers 6 urgent-training-job
    - name: assert-collaborative-drain-and-survival
      try:
        - assert:
            file: 03-assert-ray-partially-drained-and-surviving.yaml
        - assert:
            file: 04-assert-high-priority-admitted.yaml
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ../../../assert-worker-pods.sh ray-data-pipeline workers 6 2
