# The preemptor shrinks the cluster to 2 workers without touching replicas, which the autoscaler keeps at 4: the
# Workload keeps its admission of 4, carries the reclaim target, and releases the quota of the 2 workers above it.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: autoscaled-cluster
spec:
  workerGroupSpecs:
    - groupName: workers
      replicas: 4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  ownerReferences:
    - name: autoscaled-cluster
  annotations:
    kueue.x-k8s.io/reclaim-target-counts: workers=2
    (starts_with(@."kueue.x-k8s.io/reclaim-preemptor" || '', join('/', [$namespace, 'job-preemptor-short-']))): true
status:
  (admission.podSetAssignments[?name=='workers'].count | [0]): 4
  (reclaimablePods[?name=='workers'].count | [0]): 2
  (conditions[?type=='Evicted' && status=='True'] | length(@)): 0
---
# 300m for the head and its autoscaler, 200m for the 2 workers left, 200m for the preemptor.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: autoscaler-cluster-queue
status:
  (flavorsReservation[?name=='autoscaler-flavor'].resources[] | [?name=='cpu'].total | [0]): 700m
