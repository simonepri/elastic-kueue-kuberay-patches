apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 06-elastic-reexpansion
spec:
  # TODO(simonepri): remove the skip once patches 0008 (R3), 0009 (R4) and 0010 (R5) are stacked under 0011 (R6) and the kind
  # cluster turns on PartialPreemption and ElasticJobsViaWorkloadSlicesWithPartialReplicaScaleUp; the assertions already
  # follow the contract's R6 acceptance test, and have not run yet. See patches/kueue/contract.md.
  skip: true
  description: >
    Verifies two-way elasticity: after yielding workers to a high-priority job,
    the RayCluster automatically re-expands to its original target replica count
    once the high-priority job completes and releases its quota.
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-raycluster
      try:
        - apply:
            file: 01-raycluster.yaml
        - assert:
            file: 01-assert-ray-active.yaml
    - name: submit-preemptor
      try:
        - apply:
            file: 02-urgent-job.yaml
    - name: assert-preempted-drain
      try:
        - assert:
            file: 03-assert-drained.yaml
    - name: delete-preemptor-and-reexpand
      try:
        - delete:
            ref:
              apiVersion: batch/v1
              kind: Job
              name: reexpand-urgent-job
        - assert:
            file: 04-assert-reexpanded.yaml
