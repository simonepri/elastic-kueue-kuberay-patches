apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 01-cold-start-gang-preprovisioning
spec:
  description: >
    Verifies that a gang-scheduled batch workload submitted to Kueue triggers JIT
    pre-provisioning of Karpenter NodeClaims with anti-theft taints before Kueue admits the workload,
    preventing the 15-minute waitForPodsReady timeout failure. The NodeClaims belong to the flavor's
    NodePool, take its node class and taints, and request the resources of the pods packed onto each.
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
        - assert:
            file: 00-assert-queues.yaml
    - name: submit-gang-job
      try:
        - apply:
            file: 01-job.yaml
    - name: assert-preprovisioning-triggered
      try:
        - assert:
            file: 02-assert-nodeclaims.yaml
        - error:
            file: 02-unpacked-nodeclaims.yaml
    - name: karpenter-launches-nodeclaims
      try:
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ../launch-nodeclaims.sh 2
    - name: assert-nodes-ready-and-workload-admitted
      try:
        - assert:
            file: 03-assert-admission.yaml
    - name: deleting-the-job-releases-nodeclaims
      try:
        - delete:
            ref:
              apiVersion: batch/v1
              kind: Job
              name: distributed-training-job
        - error:
            timeout: 60s
            file: 04-nodeclaims-released.yaml
