apiVersion: v1
kind: Node
metadata:
  name: simulated-gpu-node-01
  labels:
    node.kubernetes.io/instance-type: g5.2xlarge
    topology.kubernetes.io/zone: us-east-1a
  annotations:
    karpenter.sh/nodepool: default
spec:
  taints:
    - key: karpenter.sh/claimed-by
      value: intended-gang-workload
      effect: NoSchedule
---
apiVersion: karpenter.sh/v1
kind: NodeClaim
metadata:
  name: test-claimed-nodeclaim
  labels:
    kueue.x-k8s.io/gang-id: gang-xyz
spec:
  nodeClassRef:
    group: karpenter.k8s.aws
    kind: EC2NodeClass
    name: default
  requirements:
    - key: "kubernetes.io/os"
      operator: In
      values: ["linux"]
  taints:
    - key: karpenter.sh/claimed-by
      value: intended-gang-workload
      effect: NoSchedule
