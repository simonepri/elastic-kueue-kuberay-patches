apiVersion: batch/v1
kind: Job
metadata:
  name: anti-theft-gang-job
  labels:
    kueue.x-k8s.io/queue-name: anti-theft-local-queue
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      name: gang-worker
    spec:
      containers:
        - name: worker
          image: busybox:latest
          command: ["sleep", "300"]
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
      restartPolicy: Never
