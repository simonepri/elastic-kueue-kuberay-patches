apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 05-anti-theft-node-reservation
spec:
  description: >
    Verifies that Karpenter NodeClaims pre-provisioned for a Kueue gang are protected by
    anti-theft taints, preventing competing pending workloads from hijacking warm capacity.
  steps:
    - name: simulate-preprovisioned-tainted-node
      try:
        - apply:
            file: 00-nodeclaim-and-node.yaml
    - name: spawn-competing-rogue-pod
      try:
        - apply:
            file: 01-rogue-pod.yaml
        - assert:
            file: 01-assert-rogue-pod-rejected.yaml
    - name: spawn-intended-gang-pod
      try:
        - apply:
            file: 02-intended-pod.yaml
        - assert:
            file: 02-assert-intended-pod-scheduled.yaml
