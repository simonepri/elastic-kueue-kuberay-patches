apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 05-anti-theft-node-reservation
spec:
  description: >
    Verifies that Karpenter NodeClaims dynamically pre-provisioned by Kueue's Karpenter
    controller are assigned anti-theft taints (karpenter.sh/claimed-by) preventing rogue workloads
    from stealing capacity, that the workload is admitted once nodes are ready, and that the
    NodeClaim's do-not-disrupt hold is removed from it and its Node once a pod is bound to the Node.
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-gang-workload
      try:
        - apply:
            file: 01-gang-workload.yaml
    - name: assert-nodeclaim-created-with-anti-theft-taint
      try:
        - assert:
            file: 02-assert-tainted-nodeclaim.yaml
    - name: karpenter-launches-nodeclaims
      try:
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ../launch-nodeclaims.sh 1
    - name: assert-admission-granted
      try:
        - assert:
            file: 03-assert-admitted.yaml
    - name: spawn-competing-rogue-pod
      try:
        - apply:
            file: 00-nodeclaim-and-node.yaml
        - apply:
            file: 01-rogue-pod.yaml
        - assert:
            file: 01-assert-rogue-pod-rejected.yaml
    - name: spawn-intended-gang-pod
      try:
        - apply:
            file: 02-intended-pod.yaml
        - assert:
            file: 02-assert-intended-pod-scheduled.yaml
    - name: hold-released-once-pod-bound
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
              - name: NODE
                value: simulated-gpu-node-01
            content: ../bind-nodeclaims.sh
        - assert:
            file: 04-assert-hold-released.yaml
