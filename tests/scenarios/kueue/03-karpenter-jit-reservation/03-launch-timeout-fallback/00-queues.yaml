# Two flavors: Karpenter capacity guarded by a 10s launch timeout, then remote capacity without the check.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: karpenter-capacity
spec:
  nodeLabels:
    example.com/pool: karpenter
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: remote-capacity
spec:
  nodeLabels:
    type: virtual-kubelet
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: karpenter-fallback
  annotations:
    kueue.x-k8s.io/karpenter-launch-timeout: 10s
    # The first flavor names no NodePool, so its NodeClaims use this node class.
    kueue.x-k8s.io/karpenter-node-class: karpenter.k8s.aws/EC2NodeClass/default
spec:
  controllerName: kueue.x-k8s.io/karpenter
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fallback-queue
spec:
  namespaceSelector: {}
  admissionChecksStrategy:
    admissionChecks:
      - name: karpenter-fallback
        onFlavors: [karpenter-capacity]
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: karpenter-capacity
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 16Gi
        - name: remote-capacity
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 16Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: fallback-local-queue
spec:
  clusterQueue: fallback-queue
