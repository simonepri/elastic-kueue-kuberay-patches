# A two-pod gang that fits the first flavor, whose NodeClaims Karpenter never launches in Kind.
apiVersion: batch/v1
kind: Job
metadata:
  name: fallback-gang-job
  labels:
    kueue.x-k8s.io/queue-name: fallback-local-queue
spec:
  parallelism: 2
  completions: 2
  template:
    spec:
      containers:
        - name: worker
          image: busybox:latest
          command: ["sleep", "300"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
      restartPolicy: Never
