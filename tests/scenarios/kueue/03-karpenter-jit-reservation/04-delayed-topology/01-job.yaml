apiVersion: batch/v1
kind: Job
metadata:
  name: delayed-tas-gang
  labels:
    kueue.x-k8s.io/queue-name: delayed-tas
spec:
  completionMode: Indexed
  parallelism: 3
  completions: 3
  template:
    metadata:
      annotations:
        kueue.x-k8s.io/podset-unconstrained-topology: "true"
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: worker
          image: busybox:latest
          command: [sleep, "300"]
          resources:
            requests:
              cpu: 250m
      restartPolicy: Never
