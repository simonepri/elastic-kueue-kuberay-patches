# Kueue admits the empty worker group in the first flavor and starts the cluster.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: from-zero-cluster
spec:
  suspend: false
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
status:
  admission:
    podSetAssignments:
      - name: head
        flavors:
          cpu: fz-local
      - name: workers
        flavors:
          cpu: fz-local
