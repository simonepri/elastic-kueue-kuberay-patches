# Elastic RayCluster that starts with no workers; its pods never schedule because no node carries the flavors' class label.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: from-zero-cluster
  labels:
    kueue.x-k8s.io/queue-name: fz-local-queue
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "250m"
                memory: "64Mi"
  workerGroupSpecs:
    - groupName: workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 8
      rayStartParams: {}
      template:
        spec:
          schedulingGates:
            - name: kueue.x-k8s.io/elastic-job
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "250m"
                  memory: "64Mi"
