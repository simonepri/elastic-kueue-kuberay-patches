# Checks flavor placement after an elastic RayCluster scales from zero, with greedy splitting enabled or disabled.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 06-elastic-flavor-from-zero
spec:
  description: >
    Verifies that an elastic RayCluster admitted with no workers is not pinned to the flavor
    Kueue assigned to the empty worker group. When the worker group scales to six workers and
    only three fit in that flavor, the flavor-split gate fills three there and three in the
    next flavor. With that gate off all six move to the next flavor. Each worker receives
    its entry's placement before ungating; the worker template keeps no flavor placement.
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-elastic-raycluster
      try:
        - apply:
            file: 01-raycluster.yaml
        - assert:
            file: 01-assert-admitted.yaml
        - script:
            timeout: 60s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-template-without-placement.sh
    - name: scale-up-from-zero
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: >-
              kubectl -n "$NS" patch raycluster from-zero-cluster --type=json
              -p '[{"op":"replace","path":"/spec/workerGroupSpecs/0/replicas","value":6}]'
        - script:
            timeout: 120s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-workers-follow-flavor.sh 6
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-template-without-placement.sh
