# Scales an elastic RayCluster's worker group up from zero and checks that Kueue moves it to the flavor that fits every worker.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 06-elastic-flavor-from-zero
spec:
  description: >
    Verifies that an elastic RayCluster admitted with no workers is not pinned to the flavor
    Kueue assigned to the empty worker group. When the worker group scales to six workers and
    only three fit in that flavor, the scale-up slice is admitted with all six in the next
    flavor instead of three in the first, and Kueue adds that flavor's node label and
    toleration to each worker before ungating it.
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-elastic-raycluster
      try:
        - apply:
            file: 01-raycluster.yaml
        - assert:
            file: 01-assert-admitted.yaml
    - name: scale-up-from-zero
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: >-
              kubectl -n "$NS" patch raycluster from-zero-cluster --type=json
              -p '[{"op":"replace","path":"/spec/workerGroupSpecs/0/replicas","value":6}]'
        - assert:
            file: 02-assert-moved.yaml
        - script:
            timeout: 120s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-workers-follow-flavor.sh 6
