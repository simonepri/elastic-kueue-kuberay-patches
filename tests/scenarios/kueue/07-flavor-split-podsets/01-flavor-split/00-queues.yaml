# Multi-flavor ClusterQueue and cohort setup for flavor-split PodSets.
# "flavor-a" (quota 8) then "flavor-b" (quota 8) in ClusterQueue order.
# The cohort-mate queue at higher priority shares the cohort, allowing clean reclaim.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-flavor-split-low
value: 100
globalDefault: false
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-flavor-split-high
value: 1000
globalDefault: false
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: pc-flavor-split-low
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: pc-flavor-split-high
value: 1000
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: flavor-a
spec:
  nodeLabels:
    instance-type: flavor-a
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: flavor-b
spec:
  nodeLabels:
    instance-type: flavor-b
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: flavor-split-cq
spec:
  cohortName: flavor-split-cohort
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: flavor-a
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "8"
        - name: flavor-b
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "8"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: flavor-split-cohort-mate-cq
spec:
  cohortName: flavor-split-cohort
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
    borrowWithinCohort:
      policy: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: flavor-a
          resources:
            - name: "cpu"
              nominalQuota: "0"
              borrowingLimit: "64"
            - name: "memory"
              nominalQuota: "0"
              borrowingLimit: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
              borrowingLimit: "8"
        - name: flavor-b
          resources:
            - name: "cpu"
              nominalQuota: "0"
            - name: "memory"
              nominalQuota: "0"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-flavor-split
spec:
  clusterQueue: flavor-split-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-cohort-mate
spec:
  clusterQueue: flavor-split-cohort-mate-cq
