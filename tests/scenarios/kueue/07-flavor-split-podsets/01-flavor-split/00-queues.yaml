# Two flavors in ClusterQueue order, flavor-a then flavor-b, for a team that borrows its flavor-a GPUs from a lender that reclaims them.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pc-flavor-split
value: 100
globalDefault: false
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: pc-flavor-split
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: flavor-a
spec:
  nodeLabels:
    instance-type: flavor-a
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: flavor-b
spec:
  nodeLabels:
    instance-type: flavor-b
  tolerations:
    - key: example.com/spot
      operator: Exists
      effect: NoSchedule
---
# The team owns 4 GPUs of flavor-b and borrows up to 8 of flavor-a.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: flavor-split-team
spec:
  cohortName: flavor-split-cohort
  namespaceSelector: {}
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: flavor-a
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
              borrowingLimit: "8"
        - name: flavor-b
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "4"
---
# The lender owns the 8 GPUs of flavor-a and reclaims them for its own job.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: flavor-split-lender
spec:
  cohortName: flavor-split-cohort
  namespaceSelector: {}
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: flavor-a
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: "8"
        - name: flavor-b
          resources:
            - name: "cpu"
              nominalQuota: "0"
            - name: "memory"
              nominalQuota: "0"
            - name: "nvidia.com/gpu"
              nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-flavor-split
spec:
  clusterQueue: flavor-split-team
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-flavor-split-lender
spec:
  clusterQueue: flavor-split-lender
