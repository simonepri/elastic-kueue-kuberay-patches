# Elastic RayCluster with the partial scale-up strategy whose one worker group starts with no workers.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: flavor-split-cluster
  labels:
    kueue.x-k8s.io/queue-name: lq-flavor-split
    kueue.x-k8s.io/priority-class: pc-flavor-split
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
    kueue.x-k8s.io/elastic-job-scale-up-strategy: partial
spec:
  rayVersion: "2.38.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        priorityClassName: pc-flavor-split
        containers:
          - name: ray-head
            image: rayproject/ray:2.38.0
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
  workerGroupSpecs:
    - groupName: workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 16
      rayStartParams: {}
      template:
        spec:
          priorityClassName: pc-flavor-split
          containers:
            - name: ray-worker
              image: rayproject/ray:2.38.0
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
