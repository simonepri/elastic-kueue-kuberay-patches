# Grows an elastic RayCluster worker group past its first flavor and checks that the added workers run on the second flavor in a split entry of the same Workload, through a reclaim, two scale-downs and a merge-back.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 07-flavor-split-podsets
  labels:
    partial-preemption: required
spec:
  description: >
    Verifies flavor-split PodSets (ElasticJobsViaWorkloadSlicesFlavorSplit) for an elastic RayCluster worker group.
    The team borrows 8 GPUs of flavor-a and owns 4 of flavor-b, in that ClusterQueue order.
    1. Overflow: scaling from 0 to 12 workers admits 8 on flavor-a, then splits the refused growth into the
       entry workers--2, which runs the other 4 on flavor-b, in one admitted Workload.
    2. Reclaim: the lender's job reclaims flavor-a; partial preemption stops only the 8 workers of entry workers,
       which KubeRay recreates gated, while the 4 on flavor-b keep running and the cluster is not suspended.
       Once the lender's job is gone, the cluster regrows to 8 on flavor-a.
    3. Shrink: a scale-down to 10 that deletes two workers of workers--2 lowers that entry to 2.
    4. Merge-back: a scale-down to 6 that deletes the last two workers of workers--2 and two of workers lowers
       workers--2 to 0; the next scale-up to 8 creates a slice without it.
    5. Finish: deleting the cluster finishes its Workloads and removes its pods.
  catch:
    - script:
        env:
          - name: NS
            value: ($namespace)
        content: ../../../dump-namespace.sh
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-raycluster
      try:
        - apply:
            file: 01-raycluster.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=0
    - name: overflow-to-the-next-flavor
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 12
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@flavor-a workers--2=4@flavor-b
    - name: reclaim-one-flavor
      try:
        - apply:
            file: 02-lender-job.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-reclaimed.sh
        - delete:
            ref:
              apiVersion: batch/v1
              kind: Job
              name: flavor-split-lender-job
            deletionPropagationPolicy: Background
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@flavor-a workers--2=4@flavor-b
    - name: shrink-the-entry-that-lost-pods
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 10 workers--2=2
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@flavor-a workers--2=2@flavor-b
    - name: merge-back
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 6 workers--2=2 workers=2
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=6@flavor-a workers--2=0
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 8
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@flavor-a
    - name: finish
      try:
        - delete:
            ref:
              apiVersion: ray.io/v1
              kind: RayCluster
              name: flavor-split-cluster
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-job-finish.sh
