# Shrinks an elastic RayCluster worker group on its first flavor through a reclaim and checks that it regrows onto the second flavor in a split entry while the preemptor keeps the first.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 07-flavor-split-regrow-onto-other-flavor
  labels:
    partial-preemption: required
spec:
  description: >
    Verifies that a worker group shrunk by partial preemption regrows onto another flavor
    (ElasticJobsViaWorkloadSlicesFlavorSplit). The team borrows 8 GPUs of flavor-a and owns 12 of flavor-b.
    1. The worker group scales from 0 to 8 workers, all on flavor-a.
    2. The lender's job reclaims 6 GPUs of flavor-a; partial preemption stops 6 workers, which KubeRay
       recreates gated, and keeps 2 running; the cluster is not suspended.
    3. While the lender's job holds flavor-a, the regrowth slice is refused there and its growth moves to
       the entry workers--2 on flavor-b, so the group runs 8 workers again in one admitted Workload.
    4. Deleting the cluster finishes its Workloads and removes its pods.
  catch:
    - script:
        env:
          - name: NS
            value: ($namespace)
        content: ../../../dump-namespace.sh
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: scale-up-on-the-first-flavor
      try:
        - apply:
            file: ../01-flavor-split/01-raycluster.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/assert-entries.sh workers=0
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/scale.sh 8
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/assert-entries.sh workers=8@flavor-a
    - name: reclaim-most-of-the-first-flavor
      try:
        - apply:
            file: 02-lender-job.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/assert-reclaimed.sh 2 - -
    - name: regrow-onto-the-second-flavor
      try:
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/assert-entries.sh workers=2@flavor-a workers--2=6@flavor-b
    - name: finish
      try:
        - delete:
            ref:
              apiVersion: ray.io/v1
              kind: RayCluster
              name: flavor-split-cluster
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ../01-flavor-split/assert-job-finish.sh
