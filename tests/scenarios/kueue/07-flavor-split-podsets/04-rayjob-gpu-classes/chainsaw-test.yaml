# Verifies flavor-split PodSets for an elastic RayJob with a CPU head and GPU workers sharing one ClusterQueue resource group across distinct gpu-class flavors.
# Head requires node affinity karpenter.sh/capacity-type In [reserved, on-demand], CPU only (no GPU toleration).
# Workers requires node affinity instance-gpu-memory Gt 20000, 1 GPU, tolerates nvidia.com/gpu, without a gpu-class selector.
# The queue has reserved-gpu (6 GPUs, tainted nvidia.com/gpu, gpu-class: h200), spot-gpu (16 GPUs, tainted nvidia.com/gpu, gpu-class: l4), and on-demand (CPU only).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 07-flavor-split-rayjob-gpu-classes
  labels:
    partial-preemption: required
spec:
  description: >
    Verifies flavor-split PodSets (ElasticJobsViaWorkloadSlicesFlavorSplit) when an elastic RayJob has a CPU-only
    head pod set and GPU worker group sharing one ClusterQueue resource group across flavors with distinct gpu-class labels.
    The job uses atomic scale-up, with no partial strategy or worker MinCount.
    1. Head is admitted on on-demand (reserved-gpu and spot-gpu have untolerated GPU taints).
    2. Workers scale directly from 0 to 10: workers x6 on reserved-gpu and workers--2 x4 on spot-gpu.
       Each entry's pods carry its distinct gpu-class selector.
    3. With partial preemption enabled, opt in to reclaim, keep two workers on A and regrow four in a new B entry.
       The existing B workers and head survive; the RayJob stays unsuspended.
    4. Scale down, then regrow to 6 to drop empty split entries and merge back.
    5. Finish: deleting the RayJob finishes its Workloads and removes its pods.
  catch:
    - script:
        env:
          - name: NS
            value: ($namespace)
        content: ../../../dump-namespace.sh
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-rayjob
      try:
        - apply:
            file: 01-rayjob.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=0
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: overflow-to-the-next-flavor
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 10
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=6@reserved-gpu workers--2=4@spot-gpu
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: reclaim-regrow-shrink-and-merge-back
      try:
        - script:
            timeout: 400s
            env:
              - name: NS
                value: ($namespace)
            content: ./reclaim-and-shrink.sh
    - name: finish
      try:
        - delete:
            ref:
              apiVersion: ray.io/v1
              kind: RayJob
              name: flavor-split-job
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-job-finish.sh
