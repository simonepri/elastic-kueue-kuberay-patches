# Verifies flavor-split PodSets for an elastic RayJob with a CPU head and GPU workers sharing one ClusterQueue resource group across distinct gpu-class flavors.
# Head requires node affinity karpenter.sh/capacity-type In [reserved, on-demand], CPU only (no GPU toleration).
# Workers requires node affinity instance-gpu-memory Gt 20000, 1 GPU, tolerates nvidia.com/gpu, without a gpu-class selector.
# The queue has reserved-gpu (8 GPUs, tainted nvidia.com/gpu, gpu-class: h200), spot-gpu (16 GPUs, tainted nvidia.com/gpu, gpu-class: l4), and on-demand (CPU only).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 07-flavor-split-rayjob-gpu-classes
  labels:
    partial-preemption: required
spec:
  description: >
    Verifies flavor-split PodSets (ElasticJobsViaWorkloadSlicesFlavorSplit) when an elastic RayJob has a CPU-only
    head pod set and GPU worker group sharing one ClusterQueue resource group across flavors with distinct gpu-class labels.
    1. Head is admitted on on-demand (reserved-gpu and spot-gpu have untolerated GPU taints).
    2. Workers scale from 0 to 8 on reserved-gpu (gpu-class: h200).
    3. Scale-up to 12 workers: workers growth moves to split entry workers--2 on spot-gpu (gpu-class: l4).
       Pods of each entry carry their respective gpu-class selector without scale-up probe failure.
    4. Scale-down to 6 workers, then back to 8: workers--2 shrinks to 0 and merges back.
    5. Finish: deleting the RayJob finishes its Workloads and removes its pods.
  catch:
    - script:
        env:
          - name: NS
            value: ($namespace)
        content: ../../../dump-namespace.sh
  steps:
    - name: setup-queues
      try:
        - apply:
            file: 00-queues.yaml
    - name: submit-rayjob
      try:
        - apply:
            file: 01-rayjob.yaml
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=0
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: scale-up-to-reserved
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 8
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@reserved-gpu
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: overflow-to-the-next-flavor
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 12
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@reserved-gpu workers--2=4@spot-gpu
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: scale-down-and-merge-back
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 6 workers--2=4 workers=2
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=6@reserved-gpu workers--2=0
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: ./scale.sh 8
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-entries.sh workers=8@reserved-gpu
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-head.sh on-demand
    - name: finish
      try:
        - delete:
            ref:
              apiVersion: ray.io/v1
              kind: RayJob
              name: flavor-split-job
        - script:
            timeout: 100s
            env:
              - name: NS
                value: ($namespace)
            content: ./assert-job-finish.sh
